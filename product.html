<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل المنتج - متجر دكن</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f0f0f;
            --card-bg: #1a1a1a;
            --text-color: #f5f5f5;
            --accent-color: #d4a373;
            --border-color: #333333;
            --whatsapp-color: #25d366;
        }
        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        h1 {
            color: var(--accent-color);
            font-size: 2rem;
            margin-bottom: 5px;
        }
        .back-home {
            display: inline-block;
            color: var(--accent-color);
            text-decoration: none;
            font-weight: 700;
            margin-bottom: 15px;
        }
        .product-details-container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        @media(min-width: 768px) {
            .product-details-container {
                flex-direction: row;
            }
        }
        .product-image-box {
            flex: 1;
            background: #222;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 350px;
        }
        .product-image-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .product-info-box {
            flex: 1;
            padding: 25px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .product-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 10px;
        }
        .product-price {
            font-size: 1.2rem;
            color: var(--accent-color);
            font-weight: 700;
            margin-bottom: 15px;
        }
        .product-desc {
            color: #aaa;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        /* صندوق الفورم والكمية */
        .order-form-box {
            background: #221f1b;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
            margin-top: 15px;
        }
        .form-group {
            margin-bottom: 12px;
        }
        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: #ccc;
            margin-bottom: 5px;
        }
        .form-control {
            width: 100%;
            background: #111;
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 10px;
            border-radius: 8px;
            font-family: 'Cairo', sans-serif;
            font-size: 0.95rem;
            box-sizing: border-box;
            outline: none;
        }
        .form-control:focus {
            border-color: var(--accent-color);
        }
        .form-control[readonly] {
            color: #888;
            cursor: not-allowed;
        }

        /* عداد الكمية */
        .quantity-control {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .qty-btn {
            background: #333;
            color: #fff;
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .qty-btn:hover { background: #444; }
        .qty-input {
            flex: 1;
            text-align: center;
            font-weight: 700;
        }

        .whatsapp-order-btn {
            display: block;
            width: 100%;
            background-color: var(--whatsapp-color);
            color: white;
            text-align: center;
            padding: 12px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1rem;
            margin-top: 15px;
            border: none;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .whatsapp-order-btn:hover { opacity: 0.9; }

        .loading, .error {
            text-align: center;
            padding: 40px;
            font-size: 1.1rem;
            color: #888;
        }
        .error { color: #ff5252; }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="back-home">← العودة إلى المتجر الرئيسي</a>
        <h1>متجر دكن</h1>
    </header>

    <main>
        <div id="product-root">
            <div class="loading">جاري تحميل تفاصيل المنتج...</div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAeCLqtBvTvk430tgAIBRLu_r7nCFKu4ao",
            authDomain: "dakn-store.firebaseapp.com",
            projectId: "dakn-store",
            storageBucket: "dakn-store.firebasestorage.app",
            messagingSenderId: "89276988534",
            appId: "1:89276988534:web:9be7e75cb86ef815b63357",
            measurementId: "G-YNQGQ4J125"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const WHATSAPP_NUMBER = "201097597133";

        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get("id");

        async function fetchProductDetails() {
            const root = document.getElementById("product-root");
            if (!productId) {
                root.innerHTML = `<div class="error">عذراً، لم يتم تحديد المنتج المطلوب.</div>`;
                return;
            }

            try {
                const docRef = doc(db, "products", productId);
                const docSnap = await getDoc(docRef);

                if (!docSnap.exists()) {
                    root.innerHTML = `<div class="error">المنتج غير موجود أو تم حذفه.</div>`;
                    return;
                }

                const product = docSnap.data();
                const productCode = product.code || productId.slice(0, 6).toUpperCase();

                root.innerHTML = `
                    <div class="product-details-container">
                        <div class="product-image-box">
                            <img src="${product.image || ''}" alt="${product.name}">
                        </div>
                        <div class="product-info-box">
                            <div>
                                <div class="product-title">${product.name}</div>
                                <div class="product-price" id="display-price">${product.price} ج.م</div>
                                <div class="product-desc">${product.description || 'لا توجد تفاصيل إضافية متاحة لهذا المنتج حالياً.'}</div>
                            </div>

                            <div class="order-form-box">
                                <div class="form-group">
                                    <label>اسم المنتج (محدد تلقائياً):</label>
                                    <input type="text" class="form-control" value="${product.name}" readonly>
                                </div>

                                <div class="form-group">
                                    <label>كود المنتج (محدد تلقائياً):</label>
                                    <input type="text" class="form-control" value="${productCode}" readonly>
                                </div>

                                <div class="form-group">
                                    <label>عدد القطع (قابل للزيادة):</label>
                                    <div class="quantity-control">
                                        <button class="qty-btn" onclick="changeQuantity(-1, ${product.price})">-</button>
                                        <input type="text" class="form-control qty-input" id="form-qty" value="1" readonly>
                                        <button class="qty-btn" onclick="changeQuantity(1, ${product.price})">+</button>
                                    </div>
                                </div>

                                <div class="form-group">
                                    <label>اسمك الكريم:</label>
                                    <input type="text" class="form-control" id="customer-name" placeholder="اكتب اسمك هنا...">
                                </div>

                                <div class="form-group">
                                    <label>رقم الموبايل:</label>
                                    <input type="tel" class="form-control" id="customer-phone" placeholder="اكتب رقم الموبايل للتواصل...">
                                </div>

                                <button class="whatsapp-order-btn" onclick="sendToWhatsApp('${product.name}', ${product.price}, '${productCode}')">
                                    إتمام الطلب وإرساله عبر الواتساب 💬
                                </button>
                            </div>
                        </div>
                    </div>
                `;

            } catch (err) {
                console.error(err);
                root.innerHTML = `<div class="error">حدث خطأ أثناء تحميل بيانات المنتج.</div>`;
            }
        }

        let currentQty = 1;

        window.changeQuantity = function(change, unitPrice) {
            currentQty += change;
            if (currentQty < 1) currentQty = 1;
            
            document.getElementById("form-qty").value = currentQty;
            const totalPrice = currentQty * unitPrice;
            document.getElementById("display-price").textContent = `${totalPrice} ج.م`;
        }

        window.sendToWhatsApp = function(productName, unitPrice, productCode) {
            const customerName = document.getElementById("customer-name").value.trim();
            const customerPhone = document.getElementById("customer-phone").value.trim();
            
            if (!customerName) {
                alert("يرجى كتابة اسمك الكريم أولاً.");
                document.getElementById("customer-name").focus();
                return;
            }

            if (!customerPhone) {
                alert("يرجى كتابة رقم الموبايل الخاص بك أولاً.");
                document.getElementById("customer-phone").focus();
                return;
            }

            const total = currentQty * unitPrice;

            let message = `مرحباً، لدي طلب جديد من المتجر:\n\n`;
            message += `👤 *اسم العميل:* ${customerName}\n`;
            message += `📱 *رقم الموبايل:* ${customerPhone}\n\n`;
            message += `👕 *المنتج:* ${productName}\n`;
            message += `🏷️ *الكود:* ${productCode}\n`;
            message += `📦 *الكمية:* ${currentQty} قطعة\n`;
            message += `💰 *السعر الإجمالي:* ${total} ج.م`;

            const encodedMessage = encodeURIComponent(message);
            window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodedMessage}`, '_blank');
        }

        fetchProductDetails();
    </script>
</body>
</html>
