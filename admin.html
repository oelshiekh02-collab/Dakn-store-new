<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة تحكم داكن</title>
  <style>
    body { background: #121212; color: #fff; font-family: sans-serif; text-align: center; padding: 50px; }
    .card { background: #1e1e1e; padding: 20px; border-radius: 8px; max-width: 400px; margin: auto; }
    input, button { width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; border: none; }
    button { background: #fff; color: #000; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <h2>إدارة المنتجات</h2>
    <p>أهلاً بك يا بطل، قريباً يتم ربط الإضافة بشكل مباشر.</p>
    <input type="text" id="pName" placeholder="اسم المنتج الجديد">
    <input type="text" id="pPrice" placeholder="السعر">
    <button onclick="alert('تم حفظ المنتج مؤقتاً بنجاح!')">حفظ المنتج</button>
  </div>
</body>
</html>
