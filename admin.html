<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم متجر دكن - Admin</title>
    <!-- استدعاء خط Cairo العربي الفخم -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f0f0f;
            --card-bg: #1a1a1a;
            --text-color: #f5f5f5;
            --accent-color: #d4a373;
            --border-color: #333333;
        }
        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .admin-container {
            max-width: 500px;
            margin: 40px auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            animation: fadeIn 0.6s ease-in-out;
        }
        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: var(--accent-color);
            letter-spacing: 1px;
            animation: slideDown 0.6s ease-in-out;
        }
        .form-group {
            margin-bottom: 20px;
            animation: slideUp 0.6s ease-in-out;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #ccc;
        }
        input[type="text"], input[type="number"], input[type="password"], input[type="file"] {
            width: 100%;
            padding: 12px;
            background-color: #262626;
            border: 1px solid #444;
            border-radius: 10px;
            color: white;
            box-sizing: border-box;
            outline: none;
            font-family: 'Cairo', sans-serif;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 8px rgba(212, 163, 115, 0.2);
        }
        input[type="file"] {
            padding: 10px;
            cursor: pointer;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: var(--accent-color);
            color: #0f0f0f;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 700;
            font-family: 'Cairo', sans-serif;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s, box-shadow 0.2s;
            animation: slideUp 0.8s ease-in-out;
        }
        button:hover {
            background-color: #e5b282;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(212, 163, 115, 0.3);
        }
        #status {
            text-align: center;
            margin-top: 15px;
            font-weight: 600;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="admin-container">
        <h2>لوحة تحكم متجر دكن</h2>
        <form id="product-form">
            <div class="form-group">
                <label for="admin-pass">كلمة سر الأدمن:</label>
                <!-- خانة كلمة المرور السرية بنظام النقاط المخفية تماماً -->
                <input type="password" id="admin-pass" required placeholder="أدخل كلمة المرور السرية">
            </div>
            <div class="form-group">
                <label for="p-name">اسم المنتج:</label>
                <input type="text" id="p-name" required placeholder="أدخل اسم المنتج">
            </div>
            <div class="form-group">
                <label for="p-price">السعر (ج.م):</label>
                <input type="number" id="p-price" required placeholder="أدخل السعر">
            </div>
            <div class="form-group">
                <label for="p-image">صورة المنتج من الجهاز مباشرة:</label>
                <!-- رفع الصورة من الجهاز -->
                <input type="file" id="p-image" accept="image/*" required>
            </div>
            <button type="submit" id="save-btn">حفظ وإضافة المنتج</button>
        </form>
        <div id="status"></div>
    </div>

    <!-- ربط Firebase وضغط الصور تلقائياً -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAeCLqtBvTvk430tgAIBRLu_r7nCFKu4ao",
            authDomain: "dakn-store.firebaseapp.com",
            projectId: "dakn-store",
            storageBucket: "dakn-store.firebasestorage.app",
            messagingSenderId: "89276988534",
            appId: "1:89276988534:web:9be7e75cb86ef815b63357",
            measurementId: "G-YNQGQ4J125"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const form = document.getElementById("product-form");
        const statusDiv = document.getElementById("status");

        const CORRECT_PASSWORD = "12345"; // كلمة السر السرية الخاصة بك

        // دالة ضغط الصورة تلقائياً لضمان عدم حدوث خطأ في الاتصال وملاءمة مساحة القاعدة
        const compressAndConvertImage = (file) => {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 800; // تصغير الأبعاد المناسبة للويب
                        const MAX_HEIGHT = 800;
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > MAX_WIDTH) {
                                height *= MAX_WIDTH / width;
                                width = MAX_WIDTH;
                            }
                        } else {
                            if (height > MAX_HEIGHT) {
                                width *= MAX_HEIGHT / height;
                                height = MAX_HEIGHT;
                            }
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        // ضغط الجودة لـ 70% عشان تترفع بسرعة وبدون أي مشاكل اتصال
                        const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.7);
                        resolve(compressedDataUrl);
                    };
                    img.onerror = (error) => reject(error);
                };
                reader.onerror = (error) => reject(error);
            });
        };

        form.addEventListener("submit", async (e) => {
            e.preventDefault();

            const enteredPass = document.getElementById("admin-pass").value;
            if (enteredPass !== CORRECT_PASSWORD) {
                statusDiv.style.color = "#ff6b6b";
                statusDiv.textContent = "كلمة المرور السرية غير صحيحة!";
                return;
            }

            const btn = document.getElementById("save-btn");
            btn.disabled = true;
            statusDiv.style.color = "#aaa";
            statusDiv.textContent = "جاري معالجة ورفع الصورة بحفظ تام...";

            const name = document.getElementById("p-name").value;
            const price = document.getElementById("p-price").value;
            const imageFile = document.getElementById("p-image").files[0];

            try {
                let imageBase64 = "";
                if (imageFile) {
                    imageBase64 = await compressAndConvertImage(imageFile);
                }

                await addDoc(collection(db, "products"), {
                    name: name,
                    price: Number(price),
                    image: imageBase64,
                    createdAt: new Date()
                });

                statusDiv.style.color = "#4ade80";
                statusDiv.textContent = "تم إضافة المنتج بنجاح إلى متجر دكن! 🚀";
                form.reset();
            } catch (error) {
                console.error("خطأ:", error);
                statusDiv.style.color = "#ff6b6b";
                statusDiv.textContent = "حدث خطأ في الاتصال، تأكد من الإنترنت وحاول مرة أخرى.";
            } finally {
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
