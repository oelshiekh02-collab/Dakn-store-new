<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم - متجر داكن</title>
  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    * { box-sizing: border-box; font-family: system-ui, sans-serif; }
    body { background-color: #0b0b0b; color: #fff; margin: 0; padding: 20px; display: flex; justify-content: center; min-height: 100vh; }
    .admin-box { background: #161616; padding: 25px; border-radius: 16px; width: 100%; max-width: 500px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); border: 1px solid #222; animation: fadeIn 0.8s ease-in-out; margin-bottom: 30px; }
    h2 { text-align: center; margin-bottom: 20px; color: #fff; font-size: 26px; }
    label { display: block; margin-bottom: 8px; color: #ccc; font-size: 17px; font-weight: bold; }
    input, button { width: 100%; padding: 14px; margin-bottom: 18px; border-radius: 10px; border: 1px solid #333; background: #222; color: #fff; font-size: 17px; transition: 0.3s; }
    input:focus { border-color: #fff; outline: none; }
    input[type="file"] { padding: 8px; cursor: pointer; }
    button { background: #fff; color: #000; font-weight: bold; cursor: pointer; font-size: 18px; margin-top: 5px; }
    button:hover { background: #e0e0e0; }
    .back-link { display: block; text-align: center; margin-top: 15px; color: #888; text-decoration: none; font-size: 16px; }
    .back-link:hover { color: #fff; }
    
    .manage-section { margin-top: 30px; border-top: 1px solid #333; padding-top: 20px; }
    .manage-item { display: flex; justify-content: space-between; align-items: center; background: #1f1f1f; padding: 12px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #2a2a2a; }
    .manage-item span { font-size: 16px; color: #ddd; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px; }
    .delete-btn { background: #ff4d4d; color: #fff; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 14px; width: auto; margin: 0; }
    .delete-btn:hover { background: #e03131; }
  </style>
</head>
<body>

  <div class="admin-box">
    <h2>إدارة متجر داكن</h2>
    <form id="productForm">
      <label>اسم المنتج أو القطعة:</label>
      <input type="text" id="title" placeholder="مثال: تيشرت أوفرسايز داكن" required>

      <label>السعر (بالجنيه):</label>
      <input type="text" id="price" placeholder="مثال: 350" required>

      <label>اختر صورة المنتج من جهازك:</label>
      <input type="file" id="imageFile" accept="image/*" required>

      <button type="submit" id="submitBtn">حفظ ونشر المنتج</button>
    </form>

    <div class="manage-section">
      <h3 style="font-size: 20px; margin-bottom: 15px; color: #fff;">المنتجات الحالية:</h3>
      <div id="adminProductList">
        <p style="color: #666; text-align: center;">جاري تحميل المنتجات...</p>
      </div>
    </div>

    <a href="index.html" class="back-link">الذهاب للمتجر الرئيسي</a>
  </div>

  <script>
    const GITHUB_USER = "oelshiekh02-collab";
    const REPO_NAME = "Dakn-store-new";
    const GITHUB_TOKEN = "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";

    let products = [];
    let fileSha = "";

    async function fetchProductsFromGitHub() {
      try {
        const response = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${REPO_NAME}/contents/products.json`);
        const data = await response.json();
        fileSha = data.sha;
        const decodedContent = JSON.parse(decodeURIComponent(escape(atob(data.content))));
        products = decodedContent;
        renderAdminList();
      } catch (error) {
        console.error("خطأ في جلب البيانات:", error);
      }
    }

    async function updateGitHubProducts() {
      const contentEncoded = btoa(unescape(encodeURIComponent(JSON.stringify(products, null, 2))));
      const response = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${REPO_NAME}/contents/products.json`, {
        method: "PUT",
        headers: {
          "Authorization": `token ${GITHUB_TOKEN}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          message: "Update products.json from admin panel",
          content: contentEncoded,
          sha: fileSha
        })
      });

      const result = await response.json();
      if (response.ok) {
        fileSha = result.content.sha;
        alert("تم رفع ونشر المنتج بنجاح وتحديث المتجر لكل الأجهزة!");
      } else {
        alert("حدث خطأ أثناء الحفظ.");
      }
    }

    function renderAdminList() {
      const adminList = document.getElementById('adminProductList');
      adminList.innerHTML = '';
      if (products.length === 0) {
        adminList.innerHTML = '<p style="color: #666; font-size: 15px; text-align: center;">لا توجد منتجات حالياً</p>';
        return;
      }
      products.forEach((prod, index) => {
        adminList.innerHTML += `
          <div class="manage-item">
            <span>${prod.title} (${prod.price} ج)</span>
            <button class="delete-btn" type="button" onclick="removeProduct(${index})">حذف</button>
          </div>
        `;
      });
    }

    window.removeProduct = async function(index) {
      if (confirm('هل أنت متأكد من حذف هذا المنتج؟')) {
        products.splice(index, 1);
        await updateGitHubProducts();
        renderAdminList();
      }
    }

    document.getElementById('productForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const title = document.getElementById('title').value;
      const price = document.getElementById('price').value;
      const fileInput = document.getElementById('imageFile');
      const btn = document.getElementById('submitBtn');

      btn.innerText = "جاري الرفع والنشر...";
      btn.disabled = true;

      const reader = new FileReader();
      reader.onload = async function(event) {
        const imageData = event.target.result;
        products.push({ title, price, image: imageData });
        
        await updateGitHubProducts();
        document.getElementById('productForm').reset();
        renderAdminList();
        btn.innerText = "حفظ ونشر المنتج";
        btn.disabled = false;
      };

      if (fileInput.files[0]) {
        reader.readAsDataURL(fileInput.files[0]);
      }
    });

    fetchProductsFromGitHub();
  </script>

</body>
</html>
