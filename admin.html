<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم - متجر داكن</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, sans-serif; }
    body { background-color: #0f0f0f; color: #fff; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .admin-box { background: #1a1a1a; padding: 25px; border-radius: 10px; width: 100%; max-width: 450px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
    h2 { text-align: center; margin-bottom: 20px; color: #fff; }
    label { display: block; margin-bottom: 8px; color: #bbb; font-size: 14px; }
    input, button { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 6px; border: 1px solid #333; background: #2a2a2a; color: #fff; font-size: 16px; }
    input:focus { border-color: #fff; outline: none; }
    button { background: #fff; color: #000; font-weight: bold; cursor: pointer; transition: 0.2s; }
    button:hover { background: #ddd; }
  </style>
</head>
<body>

  <div class="admin-box">
    <h2>إدارة متجر داكن</h2>
    <form id="productForm">
      <label>اسم المنتج أو القطعة:</label>
      <input type="text" id="title" placeholder="مثال: تيشرت أوفرسايز داكن" required>

      <label>السعر (بالجنيه):</label>
      <input type="text" id="price" placeholder="مثال: 350" required>

      <label>رابط الصورة:</label>
      <input type="text" id="image" placeholder="ضع رابط صورة المنتج هنا" required>

      <button type="submit">حفظ وإضافة المنتج</button>
    </form>
  </div>

  <script>
    document.getElementById('productForm').addEventListener('submit', function(e) {
      e.preventDefault();
      alert('تم حفظ البيانات بنجاح! سيتم ربطها بالموقع فوراً.');
    });
  </script>

</body>
</html>
