<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم الشاملة - متجر دكن</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f0f0f;
            --card-bg: #1a1a1a;
            --text-color: #f5f5f5;
            --accent-color: #d4a373;
            --border-color: #333333;
            --danger-color: #ff5252;
            --edit-color: #4facfe;
            --success-color: #4ade80;
        }
        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .admin-container {
            max-width: 700px;
            margin: 30px auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
        }
        h2, h3 { text-align: center; color: var(--accent-color); }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #ccc; }
        input[type="text"], input[type="number"], input[type="password"], input[type="file"], select, textarea {
            width: 100%;
            padding: 12px;
            background-color: #262626;
            border: 1px solid #444;
            border-radius: 10px;
            color: white;
            box-sizing: border-box;
            outline: none;
            font-family: 'Cairo', sans-serif;
        }
        input:focus, select:focus, textarea:focus { border-color: var(--accent-color); }
        textarea { height: 80px; resize: vertical; }
        .checkbox-group { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; cursor: pointer; }
        .checkbox-group input { width: 20px; height: 20px; accent-color: var(--accent-color); }
        button {
            width: 100%;
            padding: 14px;
            background-color: var(--accent-color);
            color: #0f0f0f;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 700;
            font-family: 'Cairo', sans-serif;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background-color: #e5b282; }
        #status, #promo-status { text-align: center; margin-top: 15px; font-weight: 600; }
        hr { border: 0; height: 1px; background: var(--border-color); margin: 40px 0; }
        .product-manage-list { display: flex; flex-direction: column; gap: 15px; max-height: 400px; overflow-y: auto; }
        .manage-item { display: flex; align-items: center; justify-content: space-between; background: #222; padding: 12px 15px; border-radius: 10px; border: 1px solid #333; }
        .manage-info { display: flex; align-items: center; gap: 15px; }
        .manage-info img { width: 50px; height: 50px; object-fit: cover; border-radius: 6px; }
        .manage-actions { display: flex; gap: 10px; }
        .btn-delete { background-color: var(--danger-color); color: white; padding: 8px 14px; border-radius: 8px; border: none; cursor: pointer; }
        .btn-edit { background-color: var(--edit-color); color: #fff; padding: 8px 14px; border-radius: 8px; border: none; cursor: pointer; }
    </style>
</head>
<body>

    <div class="admin-container">
        <h2>لوحة تحكم متجر دكن</h2>
        
        <!-- إدارة العروض -->
        <div style="background: #222; padding: 20px; border-radius: 12px; border: 1px solid #333; margin-bottom: 30px;">
            <h3>إدارة العروض الترويجية 🔥</h3>
            <form id="promo-form">
                <div class="form-group">
                    <label>كلمة سر الأدمن:</label>
                    <input type="password" id="admin-pass-promo" required placeholder="كلمة المرور">
                </div>
                <div class="form-group">
                    <label>عنوان العرض:</label>
                    <input type="text" id="promo-title-input" placeholder="مثال: خصم خاص لفترة محدودة">
                </div>
                <div class="form-group">
                    <label>تفاصيل العرض:</label>
                    <textarea id="promo-desc-input" placeholder="تفاصيل العرض..."></textarea>
                </div>
                <label class="checkbox-group">
                    <input type="checkbox" id="promo-active-checkbox">
                    <span>تفعيل ظهور العرض في المتجر</span>
                </label>
                <button type="submit" style="background-color: #4facfe; color: white;">حفظ العرض</button>
            </form>
            <div id="promo-status"></div>
        </div>

        <hr>

        <!-- إضافة منتج جديد مع اختيار القسم بالإنجليزية -->
        <h3>إضافة منتج جديد وتصنيفه</h3>
        <form id="product-form">
            <div class="form-group">
                <label>كلمة سر الأدمن:</label>
                <input type="password" id="admin-pass" required placeholder="كلمة المرور">
            </div>
            <div class="form-group">
                <label>اسم المنتج:</label>
                <input type="text" id="p-name" required placeholder="اسم المنتج">
            </div>
            <div class="form-group">
                <label>السعر (ج.م):</label>
                <input type="number" id="p-price" required placeholder="السعر">
            </div>
            <div class="form-group">
                <label>اختر القسم (التصنيف):</label>
                <select id="p-category" required>
                    <option value="tshirt">T-Shirts</option>
                    <option value="pants">Pants</option>
                    <option value="hoodie">Hoodies</option>
                    <option value="shorts">Shorts</option>
                </select>
            </div>
            <div class="form-group">
                <label>صورة المنتج:</label>
                <input type="file" id="p-image" accept="image/*" required>
            </div>
            <button type="submit" id="save-btn">حفظ وإضافة المنتج</button>
        </form>
        <div id="status"></div>

        <hr>

        <h3>إدارة المنتجات الحالية</h3>
        <div id="manage-container" class="product-manage-list">
            <div style="text-align: center; color: #888;">جاري التحميل...</div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, updateDoc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAeCLqtBvTvk430tgAIBRLu_r7nCFKu4ao",
            authDomain: "dakn-store.firebaseapp.com",
            projectId: "dakn-store",
            storageBucket: "dakn-store.firebasestorage.app",
            messagingSenderId: "89276988534",
            appId: "1:89276988534:web:9be7e75cb86ef815b63357",
            measurementId: "G-YNQGQ4J125"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const CORRECT_PASSWORD = "12345";

        const compressAndConvertImage = (file) => {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width, height = img.height;
                        const MAX = 800;
                        if (width > height && width > MAX) { height *= MAX / width; width = MAX; }
                        else if (height > MAX) { width *= MAX / height; height = MAX; }
                        canvas.width = width; canvas.height = height;
                        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', 0.7));
                    };
                    img.onerror = reject;
                };
                reader.onerror = reject;
            });
        };

        async function loadPromo() {
            const snap = await getDoc(doc(db, "settings", "promo"));
            if (snap.exists()) {
                document.getElementById("promo-title-input").value = snap.data().title || "";
                document.getElementById("promo-desc-input").value = snap.data().description || "";
                document.getElementById("promo-active-checkbox").checked = snap.data().isActive || false;
            }
        }
        loadPromo();

        document.getElementById("promo-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            if (document.getElementById("admin-pass-promo").value !== CORRECT_PASSWORD) {
                alert("كلمة المرور غير صحيحة!"); return;
            }
            await setDoc(doc(db, "settings", "promo"), {
                title: document.getElementById("promo-title-input").value,
                description: document.getElementById("promo-desc-input").value,
                isActive: document.getElementById("promo-active-checkbox").checked
            });
            document.getElementById("promo-status").style.color = "#4ade80";
            document.getElementById("promo-status").textContent = "تم تحديث العرض بنجاح!";
        });

        document.getElementById("product-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            if (document.getElementById("admin-pass").value !== CORRECT_PASSWORD) {
                alert("كلمة المرور غير صحيحة!"); return;
            }

            const btn = document.getElementById("save-btn");
            btn.disabled = true;
            document.getElementById("status").textContent = "جاري الحفظ...";

            try {
                const imageFile = document.getElementById("p-image").files[0];
                const imageBase64 = imageFile ? await compressAndConvertImage(imageFile) : "";

                await addDoc(collection(db, "products"), {
                    name: document.getElementById("p-name").value,
                    price: Number(document.getElementById("p-price").value),
                    category: document.getElementById("p-category").value,
                    image: imageBase64,
                    createdAt: new Date()
                });

                document.getElementById("status").style.color = "#4ade80";
                document.getElementById("status").textContent = "تم إضافة المنتج بنجاح!";
                e.target.reset();
                loadManage();
            } catch(err) {
                document.getElementById("status").style.color = "#ff5252";
                document.getElementById("status").textContent = "حدث خطأ أثناء الحفظ.";
            } finally { btn.disabled = false; }
        });

        async function loadManage() {
            const container = document.getElementById("manage-container");
            const snapshot = await getDocs(collection(db, "products"));
            container.innerHTML = "";
            if (snapshot.empty) { container.innerHTML = `<div style="text-align:center;color:#888;">لا توجد منتجات.</div>`; return; }

            snapshot.forEach(docItem => {
                const p = docItem.data();
                const id = docItem.id;
                const div = document.createElement("div");
                div.className = "manage-item";
                div.innerHTML = `
                    <div class="manage-info">
                        <img src="${p.image || ''}" alt="">
                        <div>
                            <div style="font-weight:700;color:#fff;">${p.name}</div>
                            <div style="color:var(--accent-color);font-size:0.85rem;">${p.price} ج.م | (${p.category || 'عام'})</div>
                        </div>
                    </div>
                    <div class="manage-actions">
                        <button class="btn-delete" onclick="deleteProduct('${id}')">حذف</button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        window.deleteProduct = async (id) => {
            if (prompt("أدخل كلمة المرور للتأكيد:") !== CORRECT_PASSWORD) { alert("كلمة المرور خطأ!"); return; }
            if (confirm("هل تريد حذف هذا المنتج؟")) {
                await deleteDoc(doc(db, "products", id));
                loadManage();
            }
        }

        loadManage();
    </script>
</body>
</html>
