<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم متجر دكن</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fdfbf7;
            color: #2c2c2c;
            margin: 0;
            padding: 20px;
        }
        .admin-container {
            max-width: 500px;
            margin: 40px auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #e9e3d8;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #d4a373;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #bc8a5f;
        }
        #status {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="admin-container">
        <h2>إضافة منتج جديد</h2>
        <form id="product-form">
            <div class="form-group">
                <label for="p-name">اسم المنتج:</label>
                <input type="text" id="p-name" required placeholder="أدخل اسم المنتج">
            </div>
            <div class="form-group">
                <label for="p-price">السعر (ج.م):</label>
                <input type="number" id="p-price" required placeholder="أدخل السعر">
            </div>
            <div class="form-group">
                <label for="p-image">رابط الصورة (URL):</label>
                <input type="url" id="p-image" required placeholder="ضع رابط الصورة هنا">
            </div>
            <button type="submit" id="save-btn">حفظ وإضافة المنتج</button>
        </form>
        <div id="status"></div>
    </div>

    <!-- ربط Firebase لإضافة البيانات -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAeCLqtBvTvk430tgAIBRLu_r7nCFKu4ao",
            authDomain: "dakn-store.firebaseapp.com",
            projectId: "dakn-store",
            storageBucket: "dakn-store.firebasestorage.app",
            messagingSenderId: "89276988534",
            appId: "1:89276988534:web:9be7e75cb86ef815b63357",
            measurementId: "G-YNQGQ4J125"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const form = document.getElementById("product-form");
        const statusDiv = document.getElementById("status");

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            const btn = document.getElementById("save-btn");
            btn.disabled = true;
            statusDiv.style.color = "#555";
            statusDiv.textContent = "جاري حفظ المنتج في قاعدة البيانات...";

            const name = document.getElementById("p-name").value;
            const price = document.getElementById("p-price").value;
            const image = document.getElementById("p-image").value;

            try {
                await addDoc(collection(db, "products"), {
                    name: name,
                    price: Number(price),
                    image: image,
                    createdAt: new Date()
                });

                statusDiv.style.color = "green";
                statusDiv.textContent = "تم إضافة المنتج بنجاح وتخزينه سحابياً! 🚀";
                form.reset();
            } catch (error) {
                console.error("خطأ أثناء الإضافة:", error);
                statusDiv.style.color = "red";
                statusDiv.textContent = "حدث خطأ أثناء الحفظ، حاول مرة أخرى.";
            } finally {
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
