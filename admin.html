<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم متجر دكن</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f0f0f;
            color: #f5f5f5;
            margin: 0;
            padding: 20px;
        }
        .admin-container {
            max-width: 500px;
            margin: 40px auto;
            background: #1a1a1a;
            padding: 30px;
            border-radius: 16px;
            border: 1px solid #333;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            animation: fadeIn 0.6s ease-in-out;
        }
        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #d4a373;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #ccc;
        }
        input[type="text"], input[type="number"], input[type="password"], input[type="file"] {
            width: 100%;
            padding: 12px;
            background-color: #262626;
            border: 1px solid #444;
            border-radius: 8px;
            color: white;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: #d4a373;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #d4a373;
            color: #0f0f0f;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        button:hover {
            background-color: #e5b282;
            transform: translateY(-2px);
        }
        #status {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="admin-container">
        <h2>لوحة التحكم - إضافة منتج</h2>
        <form id="product-form">
            <div class="form-group">
                <label for="admin-pass">كلمة سر الأدمن:</label>
                <!-- type="password" تضمن إن الحروف تظهر مخفية كنجوم/نقاط -->
                <input type="password" id="admin-pass" required placeholder="أدخل كلمة المرور السرية">
            </div>
            <div class="form-group">
                <label for="p-name">اسم المنتج:</label>
                <input type="text" id="p-name" required placeholder="أدخل اسم المنتج">
            </div>
            <div class="form-group">
                <label for="p-price">السعر (ج.م):</label>
                <input type="number" id="p-price" required placeholder="أدخل السعر">
            </div>
            <div class="form-group">
                <label for="p-image">اختر صورة المنتج من الجهاز:</label>
                <input type="file" id="p-image" accept="image/*" required>
            </div>
            <button type="submit" id="save-btn">حفظ وإضافة المنتج</button>
        </form>
        <div id="status"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAeCLqtBvTvk430tgAIBRLu_r7nCFKu4ao",
            authDomain: "dakn-store.firebaseapp.com",
            projectId: "dakn-store",
            storageBucket: "dakn-store.firebasestorage.app",
            messagingSenderId: "89276988534",
            appId: "1:89276988534:web:9be7e75cb86ef815b63357",
            measurementId: "G-YNQGQ4J125"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const form = document.getElementById("product-form");
        const statusDiv = document.getElementById("status");

        // كلمة المرور المطلوبة (يمكنك تغييرها هنا إلى أي كلمة سر تريدها)
        const CORRECT_PASSWORD = "12345";

        const convertImageToBase64 = (file) => {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = (error) => reject(error);
            });
        };

        form.addEventListener("submit", async (e) => {
            e.preventDefault();

            const enteredPass = document.getElementById("admin-pass").value;

            // التحقق من كلمة المرور
            if (enteredPass !== CORRECT_PASSWORD) {
                statusDiv.style.color = "#ff6b6b";
                statusDiv.textContent = "كلمة المرور غير صحيحة! حاول مرة أخرى.";
                return;
            }

            const btn = document.getElementById("save-btn");
            btn.disabled = true;
            statusDiv.style.color = "#aaa";
            statusDiv.textContent = "جاري معالجة الصورة وحفظ المنتج...";

            const name = document.getElementById("p-name").value;
            const price = document.getElementById("p-price").value;
            const imageFile = document.getElementById("p-image").files[0];

            try {
                let imageBase64 = "";
                if (imageFile) {
                    imageBase64 = await convertImageToBase64(imageFile);
                }

                await addDoc(collection(db, "products"), {
                    name: name,
                    price: Number(price),
                    image: imageBase64,
                    createdAt: new Date()
                });

                statusDiv.style.color = "#4ade80";
                statusDiv.textContent = "تم رفع الصورة وحفظ المنتج بنجاح في متجر داكن! 🚀";
                form.reset();
            } catch (error) {
                console.error("خطأ أثناء الحفظ:", error);
                statusDiv.style.color = "#ff6b6b";
                statusDiv.textContent = "حدث خطأ أثناء الحفظ، حاول مرة أخرى.";
            } finally {
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
