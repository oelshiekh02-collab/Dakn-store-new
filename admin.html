<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dakn - لوحة التحكم</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }
        body {
            background-color: #f9f9f9;
            color: #111;
        }
        #login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 99999;
        }
        .login-box {
            background: #fff;
            padding: 40px;
            border: 1px solid #e5e5e5;
            border-radius: 8px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            text-align: right;
        }
        .login-box h2 {
            margin-bottom: 24px;
            font-size: 1.5rem;
            text-align: center;
            letter-spacing: 1px;
        }
        .login-box input {
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 0.95rem;
            outline: none;
            text-align: right;
        }
        .login-box button {
            width: 100%;
            padding: 12px;
            background: #111;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }

        #admin-content {
            display: none;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        #toast-notification {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #ffffff;
            color: #111111;
            border: 1px solid #e0e0e0;
            padding: 14px 28px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            z-index: 999999;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
            text-align: center;
        }
        #toast-notification.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>

    <div id="toast-notification"></div>

    <!-- Login Screen -->
    <div id="login-overlay">
        <div class="login-box">
            <h2>لوحة تحكم DAKN</h2>
            <input type="email" id="admin-email" placeholder="البريد الإلكتروني">
            <input type="password" id="admin-password" placeholder="كلمة المرور">
            <button onclick="handleAdminLogin()">تسجيل الدخول</button>
        </div>
    </div>

    <!-- Admin Dashboard Content -->
    <div id="admin-content">
        <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid #eee; padding-bottom: 15px;">
            <h1>إدارة المتجر</h1>
            <div style="display: flex; gap: 10px; align-items: center;">
                <a href="index.html" style="text-decoration: none; padding: 8px 16px; background: #111; color: #fff; border-radius: 4px; font-size: 0.9rem; font-weight: 600;">عرض المتجر</a>
                <button onclick="logoutAdmin()" style="padding: 8px 16px; background: #ff4d4d; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-weight: 600;">تسجيل الخروج</button>
            </div>
        </header>
        
        <div style="background: #fff; padding: 20px; border-radius: 6px; border: 1px solid #eee; margin-bottom: 20px;">
            <h3 style="margin-bottom: 15px;">إضافة منتج جديد</h3>
            <div style="display: flex; flex-direction: column; gap: 12px; max-width: 400px;">
                <input type="text" id="p-name" placeholder="اسم المنتج" style="padding:10px; border:1px solid #ccc; border-radius:4px;">
                <input type="number" id="p-price" placeholder="السعر (ج.م)" style="padding:10px; border:1px solid #ccc; border-radius:4px;">
                
                <div style="display: flex; flex-direction: column; gap: 5px;">
                    <label style="font-size: 0.85rem; font-weight: 600;">اختر القسم:</label>
                    <select id="p-category" style="padding:10px; border:1px solid #ccc; border-radius:4px; background:#fff; font-family:'Cairo', sans-serif;">
                        <option value="tshirt">T-Shirt</option>
                        <option value="hoodie">Hoodie</option>
                        <option value="pants">Pants</option>
                        <option value="shorts">Shorts</option>
                        <option value="suits">Suits</option>
                    </select>
                </div>
                
                <div style="display: flex; flex-direction: column; gap: 5px;">
                    <label style="font-size: 0.85rem; font-weight: 600;">اختر صورة المنتج من الجهاز:</label>
                    <input type="file" id="p-image-file" accept="image/*" style="padding:6px; border:1px solid #ccc; border-radius:4px; background:#fafafa;">
                </div>
                
                <button onclick="addNewProduct()" style="padding: 12px; background: #111; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-weight: 600;">إضافة المنتج</button>
            </div>
        </div>

        <div style="background: #fff; padding: 20px; border-radius: 6px; border: 1px solid #eee;">
            <h3 style="margin-bottom: 15px;">المنتجات الحالية</h3>
            <div id="admin-products-list">جاري التحميل...</div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc, deleteDoc, updateDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAeCLqtBvTvk430tgAIBRLu_r7nCFKu4ao",
            authDomain: "dakn-store.firebaseapp.com",
            projectId: "dakn-store",
            storageBucket: "dakn-store.firebasestorage.app",
            messagingSenderId: "89276988534",
            appId: "1:89276988534:web:9be7e75cb86ef815b63357",
            measurementId: "G-YNQGQ4J125"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.showToast = function(message) {
            const toast = document.getElementById("toast-notification");
            toast.textContent = message;
            toast.classList.add("show");
            setTimeout(() => { toast.classList.remove("show"); }, 3000);
        }

        const correctEmail = "Zerodesigner@admin.com";
        const correctPass = "Zero123123#123";

        window.handleAdminLogin = function() {
            const emailInput = document.getElementById("admin-email").value.trim();
            const passInput = document.getElementById("admin-password").value.trim();

            if (emailInput === correctEmail && passInput === correctPass) {
                document.getElementById("login-overlay").style.display = "none";
                document.getElementById("admin-content").style.display = "block";
                showToast("أهلاً بك يا أدمن!");
                loadAdminProducts();
            } else {
                showToast("البريد أو كلمة المرور غير صحيحة!");
            }
        }

        window.logoutAdmin = function() {
            document.getElementById("admin-content").style.display = "none";
            document.getElementById("login-overlay").style.display = "flex";
            document.getElementById("admin-email").value = "";
            document.getElementById("admin-password").value = "";
            showToast("تم تسجيل الخروج بنجاح.");
        }

        window.loadAdminProducts = async function() {
            const container = document.getElementById("admin-products-list");
            try {
                const snapshot = await getDocs(collection(db, "products"));
                if (snapshot.empty) {
                    container.innerHTML = "<p>لا توجد منتجات.</p>";
                    return;
                }
                let html = "<div style='display:flex; flex-direction:column; gap:10px;'>";
                snapshot.forEach(docSnap => {
                    const p = docSnap.data();
                    html += `
                        <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #eee; padding-bottom:10px; gap:10px; flex-wrap:wrap;">
                            <div style="display:flex; gap:8px;">
                                <button onclick="deleteProduct('${docSnap.id}')" style="background:#ff4d4d; color:#fff; border:none; padding:6px 12px; border-radius:4px; cursor:pointer; font-weight:600;">حذف</button>
                                <button onclick="updateProductPrice('${docSnap.id}', '${p.price}')" style="background:#333; color:#fff; border:none; padding:6px 12px; border-radius:4px; cursor:pointer; font-weight:600;">تعديل السعر</button>
                            </div>
                            <div style="display:flex; align-items:center; gap:10px; text-align:right;">
                                <div><strong>${p.name}</strong> (${p.category}) - <span id="price-${docSnap.id}">${p.price}</span> EGP</div>
                                <img src="${p.image}" style="width:45px; height:45px; object-fit:cover; border-radius:4px;">
                            </div>
                        </div>
                    `;
                });
                html += "</div>";
                container.innerHTML = html;
            } catch (err) {
                console.error(err);
                container.innerHTML = "<p style='color:red;'>فشل تحميل المنتجات.</p>";
            }
        }

        window.addNewProduct = async function() {
            const name = document.getElementById("p-name").value.trim();
            const price = document.getElementById("p-price").value.trim();
            const category = document.getElementById("p-category").value;
            const imageFile = document.getElementById("p-image-file").files[0];

            if (!name || !price) {
                showToast("الرجاء إدخال الاسم والسعر.");
                return;
            }

            if (!imageFile) {
                showToast("الرجاء اختيار صورة من الجهاز.");
                return;
            }

            const reader = new FileReader();
            reader.onload = async function(uploadEvent) {
                const finalImageUrl = uploadEvent.target.result;
                try {
                    await addDoc(collection(db, "products"), {
                        name,
                        price: Number(price),
                        image: finalImageUrl,
                        category,
                        sizes: "S, M, L, XL",
                        description: "High quality elegant design from DAKN."
                    });
                    showToast("تم إضافة المنتج بنجاح!");
                    document.getElementById("p-name").value = "";
                    document.getElementById("p-price").value = "";
                    document.getElementById("p-image-file").value = "";
                    loadAdminProducts();
                } catch (err) {
                    console.error(err);
                    showToast("حدث خطأ أثناء إضافة المنتج.");
                }
            };
            reader.readAsDataURL(imageFile);
        }

        window.updateProductPrice = async function(id, currentPrice) {
            const newPriceStr = prompt("أدخل السعر الجديد للمنتج:", currentPrice);
            if (newPriceStr === null) return;
            const newPrice = Number(newPriceStr);

            if (isNaN(newPrice) || newPrice <= 0) {
                showToast("الرجاء إدخال سعر صحيح.");
                return;
            }

            try {
                const productRef = doc(db, "products", id);
                await updateDoc(productRef, { price: newPrice });
                showToast("تم تحديث السعر بنجاح!");
                loadAdminProducts();
            } catch (err) {
                console.error(err);
                showToast("خطأ أثناء تحديث السعر.");
            }
        }

        window.deleteProduct = async function(id) {
            if (confirm("هل أنت متأكد من حذف هذا المنتج؟")) {
                try {
                    await deleteDoc(doc(db, "products", id));
                    showToast("تم حذف المنتج بنجاح!");
                    loadAdminProducts();
                } catch (err) {
                    console.error(err);
                    showToast("خطأ أثناء حذف المنتج.");
                }
            }
        }
    </script>
</body>
</html>
