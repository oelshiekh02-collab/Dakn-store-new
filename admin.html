<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم الشاملة - متجر دكن</title>
    <!-- استدعاء خط Cairo العربي الفخم -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f0f0f;
            --card-bg: #1a1a1a;
            --text-color: #f5f5f5;
            --accent-color: #d4a373;
            --border-color: #333333;
            --danger-color: #ff5252;
            --edit-color: #4facfe;
            --success-color: #4ade80;
        }
        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .admin-container {
            max-width: 700px;
            margin: 30px auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            animation: fadeIn 0.6s ease-in-out;
        }
        h2, h3 {
            text-align: center;
            color: var(--accent-color);
            letter-spacing: 1px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #ccc;
        }
        input[type="text"], input[type="number"], input[type="password"], input[type="file"], textarea {
            width: 100%;
            padding: 12px;
            background-color: #262626;
            border: 1px solid #444;
            border-radius: 10px;
            color: white;
            box-sizing: border-box;
            outline: none;
            font-family: 'Cairo', sans-serif;
            transition: border-color 0.2s;
        }
        input:focus, textarea:focus {
            border-color: var(--accent-color);
        }
        textarea {
            resize: vertical;
            height: 90px;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            cursor: pointer;
        }
        .checkbox-group input {
            width: 20px;
            height: 20px;
            accent-color: var(--accent-color);
            cursor: pointer;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: var(--accent-color);
            color: #0f0f0f;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 700;
            font-family: 'Cairo', sans-serif;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
        }
        button:hover {
            background-color: #e5b282;
            transform: translateY(-2px);
        }
        #status, #promo-status {
            text-align: center;
            margin-top: 15px;
            font-weight: 600;
        }
        hr {
            border: 0;
            height: 1px;
            background: var(--border-color);
            margin: 40px 0;
        }
        /* جدول إدارة المنتجات */
        .product-manage-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-height: 400px;
            overflow-y: auto;
            padding-left: 5px;
        }
        .manage-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #222;
            padding: 12px 15px;
            border-radius: 10px;
            border: 1px solid #333;
        }
        .manage-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .manage-info img {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 6px;
        }
        .manage-actions {
            display: flex;
            gap: 10px;
        }
        .btn-delete {
            background-color: var(--danger-color);
            color: white;
            padding: 8px 14px;
            font-size: 0.9rem;
            border-radius: 8px;
            width: auto;
        }
        .btn-edit {
            background-color: var(--edit-color);
            color: #fff;
            padding: 8px 14px;
            font-size: 0.9rem;
            border-radius: 8px;
            width: auto;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="admin-container">
        <h2>لوحة تحكم متجر داكن</h2>
        
        <!-- قسم إدارة العروض والخصومات -->
        <div style="background: #222; padding: 20px; border-radius: 12px; border: 1px solid #333; margin-bottom: 30px;">
            <h3>إدارة العروض الترويجية 🔥</h3>
            <form id="promo-form">
                <div class="form-group">
                    <label for="admin-pass-promo">كلمة سر الأدمن للتأكيد:</label>
                    <input type="password" id="admin-pass-promo" required placeholder="أدخل كلمة المرور السرية">
                </div>
                <div class="form-group">
                    <label for="promo-title-input">عنوان العرض:</label>
                    <input type="text" id="promo-title-input" placeholder="مثال: خصم 20% لفترة محدودة على التصوير">
                </div>
                <div class="form-group">
                    <label for="promo-desc-input">تفاصيل العرض:</label>
                    <textarea id="promo-desc-input" placeholder="اكتب تفاصيل العرض هنا ليقرأها العميل..."></textarea>
                </div>
                <label class="checkbox-group">
                    <input type="checkbox" id="promo-active-checkbox">
                    <span>تفعيل ظهور العرض في المتجر الآن</span>
                </label>
                <button type="submit" style="background-color: #4facfe; color: white;">حفظ وتحديث العرض</button>
            </form>
            <div id="promo-status"></div>
        </div>

        <hr>

        <!-- نموذج إضافة منتج جديد -->
        <h3>إضافة منتج جديد</h3>
        <form id="product-form">
            <div class="form-group">
                <label for="admin-pass">كلمة سر الأدمن:</label>
                <input type="password" id="admin-pass" required placeholder="أدخل كلمة المرور السرية">
            </div>
            <div class="form-group">
                <label for="p-name">اسم المنتج:</label>
                <input type="text" id="p-name" required placeholder="أدخل اسم المنتج">
            </div>
            <div class="form-group">
                <label for="p-price">السعر (ج.م):</label>
                <input type="number" id="p-price" required placeholder="أدخل السعر">
            </div>
            <div class="form-group">
                <label for="p-image">صورة المنتج من الجهاز مباشرة:</label>
                <input type="file" id="p-image" accept="image/*" required>
            </div>
            <button type="submit" id="save-btn">حفظ وإضافة المنتج</button>
        </form>
        <div id="status"></div>

        <hr>

        <!-- قسم إدارة المنتجات (حذف أو تعديل) -->
        <h3>إدارة المنتجات الحالية (حذف / تعديل)</h3>
        <div id="manage-container" class="product-manage-list">
            <div style="text-align: center; color: #888;">جاري تحميل المنتجات لإدارتها...</div>
        </div>
    </div>

    <!-- كود فايربيس للإدارة الكاملة والعروض -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, updateDoc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAeCLqtBvTvk430tgAIBRLu_r7nCFKu4ao",
            authDomain: "dakn-store.firebaseapp.com",
            projectId: "dakn-store",
            storageBucket: "dakn-store.firebasestorage.app",
            messagingSenderId: "89276988534",
            appId: "1:89276988534:web:9be7e75cb86ef815b63357",
            measurementId: "G-YNQGQ4J125"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const form = document.getElementById("product-form");
        const statusDiv = document.getElementById("status");
        const manageContainer = document.getElementById("manage-container");
        
        const promoForm = document.getElementById("promo-form");
        const promoStatus = document.getElementById("promo-status");

        const CORRECT_PASSWORD = "12345"; // كلمة المرور السرية

        // دالة ضغط الصور
        const compressAndConvertImage = (file) => {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 800;
                        const MAX_HEIGHT = 800;
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                        } else {
                            if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', 0.7));
                    };
                    img.onerror = reject;
                };
                reader.onerror = reject;
            });
        };

        // تحميل بيانات العرض الحالي في لوحة التحكم عند الفتح
        async function loadCurrentPromo() {
            try {
                const promoRef = doc(db, "settings", "promo");
                const snap = await getDoc(promoRef);
                if (snap.exists()) {
                    const data = snap.data();
                    document.getElementById("promo-title-input").value = data.title || "";
                    document.getElementById("promo-desc-input").value = data.description || "";
                    document.getElementById("promo-active-checkbox").checked = data.isActive || false;
                }
            } catch (err) {
                console.error("خطأ في تحميل العرض:", err);
            }
        }
        loadCurrentPromo();

        // حفظ وتحديث العرض
        promoForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            const pass = document.getElementById("admin-pass-promo").value;
            if (pass !== CORRECT_PASSWORD) {
                promoStatus.style.color = "#ff5252";
                promoStatus.textContent = "كلمة المرور السرية غير صحيحة!";
                return;
            }

            const title = document.getElementById("promo-title-input").value;
            const description = document.getElementById("promo-desc-input").value;
            const isActive = document.getElementById("promo-active-checkbox").checked;

            try {
                promoStatus.style.color = "#aaa";
                promoStatus.textContent = "جاري حفظ العرض...";

                await setDoc(doc(db, "settings", "promo"), {
                    title,
                    description,
                    isActive
                });

                promoStatus.style.color = "#4ade80";
                promoStatus.textContent = "تم تحديث وعرض الحالة بنجاح 🚀";
            } catch (err) {
                console.error(err);
                promoStatus.style.color = "#ff5252";
                promoStatus.textContent = "حدث خطأ أثناء الحفظ.";
            }
        });

        // 1. إضافة منتج جديد
        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            const enteredPass = document.getElementById("admin-pass").value;
            if (enteredPass !== CORRECT_PASSWORD) {
                statusDiv.style.color = "#ff5252";
                statusDiv.textContent = "كلمة المرور السرية غير صحيحة!";
                return;
            }

            const btn = document.getElementById("save-btn");
            btn.disabled = true;
            statusDiv.style.color = "#aaa";
            statusDiv.textContent = "جاري رفع المنتج وحفظه...";

            const name = document.getElementById("p-name").value;
            const price = document.getElementById("p-price").value;
            const imageFile = document.getElementById("p-image").files[0];

            try {
                let imageBase64 = "";
                if (imageFile) {
                    imageBase64 = await compressAndConvertImage(imageFile);
                }

                await addDoc(collection(db, "products"), {
                    name: name,
                    price: Number(price),
                    image: imageBase64,
                    createdAt: new Date()
                });

                statusDiv.style.color = "#4ade80";
                statusDiv.textContent = "تم إضافة المنتج بنجاح 🚀";
                form.reset();
                loadManageProducts();
            } catch (error) {
                console.error("خطأ:", error);
                statusDiv.style.color = "#ff5252";
                statusDiv.textContent = "حدث خطأ، تأكد من الاتصال.";
            } finally {
                btn.disabled = false;
            }
        });

        // 2. عرض المنتجات للإدارة
        async function loadManageProducts() {
            try {
                const querySnapshot = await getDocs(collection(db, "products"));
                manageContainer.innerHTML = "";

                if (querySnapshot.empty) {
                    manageContainer.innerHTML = `<div style="text-align: center; color: #888;">لا توجد منتجات حالياً.</div>`;
                    return;
                }

                querySnapshot.forEach((docItem) => {
                    const p = docItem.data();
                    const id = docItem.id;

                    const itemDiv = document.createElement("div");
                    itemDiv.className = "manage-item";
                    itemDiv.innerHTML = `
                        <div class="manage-info">
                            <img src="${p.image || ''}" alt="">
                            <div>
                                <div style="font-weight: 700; color: #fff;">${p.name}</div>
                                <div style="color: var(--accent-color); font-size: 0.9rem;">${p.price} ج.م</div>
                            </div>
                        </div>
                        <div class="manage-actions">
                            <button class="btn-edit" onclick="editProduct('${id}', '${p.name}', '${p.price}')">تعديل</button>
                            <button class="btn-delete" onclick="deleteProduct('${id}')">حذف</button>
                        </div>
                    `;
                    manageContainer.appendChild(itemDiv);
                });
            } catch (error) {
                console.error(error);
                manageContainer.innerHTML = `<div style="text-align: center; color: #ff5252;">فشل تحميل قائمة المنتجات.</div>`;
            }
        }

        // 3. حذف منتج
        window.deleteProduct = async (id) => {
            const enteredPass = prompt("أدخل كلمة المرور السرية لتأكيد الحذف:");
            if (enteredPass !== CORRECT_PASSWORD) {
                alert("كلمة المرور غير صحيحة!");
                return;
            }

            if (confirm("هل أنت متأكد من حذف هذا المنتج نهائياً؟")) {
                try {
                    await deleteDoc(doc(db, "products", id));
                    alert("تم حذف المنتج بنجاح!");
                    loadManageProducts();
                } catch (error) {
                    alert("حدث خطأ أثناء الحذف.");
                }
            }
        };

        // 4. تعديل منتج
        window.editProduct = async (id, oldName, oldPrice) => {
            const enteredPass = prompt("أدخل كلمة المرور السرية للتعديل:");
            if (enteredPass !== CORRECT_PASSWORD) {
                alert("كلمة المرور غير صحيحة!");
                return;
            }

            const newName = prompt("أدخل الاسم الجديد للمنتج:", oldName);
            if (newName === null) return;

            const newPrice = prompt("أدخل السعر الجديد للمنتج:", oldPrice);
            if (newPrice === null) return;

            try {
                const productRef = doc(db, "products", id);
                await updateDoc(productRef, {
                    name: newName,
                    price: Number(newPrice)
                });
                alert("تم تحديث البيانات بنجاح!");
                loadManageProducts();
            } catch (error) {
                alert("حدث خطأ أثناء التعديل.");
            }
        };

        loadManageProducts();
    </script>
</body>
</html>
