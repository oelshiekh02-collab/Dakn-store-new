<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - متجر دكن</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f0f0f;
            --card-bg: #1a1a1a;
            --text-color: #f5f5f5;
            --accent-color: #d4a373;
            --border-color: #333333;
            --danger-color: #ff5252;
            --success-color: #25d366;
        }
        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        h1 {
            color: var(--accent-color);
            font-size: 2rem;
            margin-bottom: 5px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        .admin-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .admin-card h2 {
            font-size: 1.2rem;
            color: var(--accent-color);
            margin-top: 0;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            font-size: 0.9rem;
            color: #ccc;
            margin-bottom: 5px;
        }
        .form-control {
            width: 100%;
            background: #111;
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 10px;
            border-radius: 8px;
            font-family: 'Cairo', sans-serif;
            font-size: 0.95rem;
            box-sizing: border-box;
            outline: none;
        }
        .form-control:focus {
            border-color: var(--accent-color);
        }
        textarea.form-control {
            resize: vertical;
            min-height: 80px;
        }
        .btn {
            background: var(--accent-color);
            color: #0f0f0f;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 700;
            font-family: 'Cairo', sans-serif;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.9; }
        .btn-danger { background: var(--danger-color); color: #fff; }
        .btn-success { background: var(--success-color); color: #fff; }

        /* جدول المنتجات في الإدارة */
        .table-responsive {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: right;
            font-size: 0.9rem;
        }
        th, td {
            padding: 10px;
            border-bottom: 1px solid var(--border-color);
        }
        th { color: var(--accent-color); font-weight: 700; }
        td img {
            width: 40px;
            height: 40px;
            object-fit: cover;
            border-radius: 6px;
        }
        .actions-cell {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }
        .action-btn {
            padding: 5px 10px;
            font-size: 0.8rem;
            border-radius: 6px;
            cursor: pointer;
            border: none;
            font-family: 'Cairo', sans-serif;
            font-weight: 600;
        }
        .back-link {
            display: inline-block;
            color: var(--accent-color);
            text-decoration: none;
            font-weight: 700;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <a href="index.html" class="back-link">← العودة إلى المتجر الرئيسي</a>
        <header>
            <h1>لوحة التحكم - متجر دكن</h1>
            <p>إدارة المنتجات، العروض، والفئات بسهولة</p>
        </header>

        <!-- قسم إدارة العرض الترويجي -->
        <div class="admin-card">
            <h2>إدارة شريط العروض الترويجية</h2>
            <div class="form-group">
                <label>عنوان العرض:</label>
                <input type="text" id="promo-title-input" class="form-control" placeholder="مثال: خصم العيد الكبرى!">
            </div>
            <div class="form-group">
                <label>نص العرض والتفاصيل:</label>
                <textarea id="promo-desc-input" class="form-control" placeholder="اكتب تفاصيل العرض هنا..."></textarea>
            </div>
            <div class="form-group">
                <label>
                    <input type="checkbox" id="promo-active-input"> تفعيل وإظهار شريط العروض في المتجر
                </label>
            </div>
            <button class="btn btn-success" onclick="savePromoSettings()">حفظ وتحديث العرض</button>
        </div>

        <!-- قسم إضافة / تعديل منتج -->
        <div class="admin-card">
            <h2 id="form-section-title">إضافة منتج جديد</h2>
            <input type="hidden" id="editing-product-id">
            <div class="form-group">
                <label>اسم المنتج:</label>
                <input type="text" id="prod-name" class="form-control" placeholder="مثال: تيشرت أوفرسايز أسود">
            </div>
            <div class="form-group">
                <label>سعر المنتج (ج.م):</label>
                <input type="number" id="prod-price" class="form-control" placeholder="مثال: 350">
            </div>
            <div class="form-group">
                <label>رابط الصورة (Image URL):</label>
                <input type="text" id="prod-image" class="form-control" placeholder="انسخ رابط الصورة هنا">
            </div>
            <div class="form-group">
                <label>الفئة (التصنيف):</label>
                <select id="prod-category" class="form-control">
                    <option value="tshirt">تيشرتات</option>
                    <option value="pants">بنطلونات</option>
                    <option value="hoodie">هوديز</option>
                    <option value="shorts">شورتات</option>
                    <option value="suits">بدلات (سوتس)</option>
                </select>
            </div>
            <div class="form-group">
                <label>وصف المنتج (اختياري):</label>
                <textarea id="prod-desc" class="form-control" placeholder="تفاصيل الخامات والمقاسات المتاحة..."></textarea>
            </div>
            <button class="btn" id="save-product-btn" onclick="saveProduct()">إضافة المنتج</button>
            <button class="btn btn-danger" id="cancel-edit-btn" style="display:none;" onclick="cancelEdit()">إلغاء التعديل</button>
        </div>

        <!-- قائمة المنتجات الحالية -->
        <div class="admin-card">
            <h2>قائمة المنتجات الحالية في المتجر</h2>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>الصورة</th>
                            <th>الاسم</th>
                            <th>السعر</th>
                            <th>الفئة</th>
                            <th>الإجراءات</th>
                        </tr>
                    </thead>
                    <tbody id="admin-products-list">
                        <tr><td colspan="5" style="text-align: center; color: #888;">جاري تحميل المنتجات...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, getDoc, updateDoc, deleteDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAeCLqtBvTvk430tgAIBRLu_r7nCFKu4ao",
            authDomain: "dakn-store.firebaseapp.com",
            projectId: "dakn-store",
            storageBucket: "dakn-store.firebasestorage.app",
            messagingSenderId: "89276988534",
            appId: "1:89276988534:web:9be7e75cb86ef815b63357",
            measurementId: "G-YNQGQ4J125"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function initAdmin() {
            await loadPromoSettings();
            await loadAdminProducts();
        }

        window.savePromoSettings = async function() {
            const title = document.getElementById("promo-title-input").value.trim();
            const description = document.getElementById("promo-desc-input").value.trim();
            const isActive = document.getElementById("promo-active-input").checked;

            try {
                await setDoc(doc(db, "settings", "promo"), { title, description, isActive });
                alert("تم تحديث شريط العروض بنجاح!");
            } catch (err) {
                console.error(err);
                alert("حدث خطأ أثناء حفظ شريط العروض.");
            }
        }

        async function loadPromoSettings() {
            try {
                const snap = await getDoc(doc(db, "settings", "promo"));
                if (snap.exists()) {
                    const data = snap.data();
                    document.getElementById("promo-title-input").value = data.title || "";
                    document.getElementById("promo-desc-input").value = data.description || "";
                    document.getElementById("promo-active-input").checked = !!data.isActive;
                }
            } catch(e) { console.error(e); }
        }

        window.saveProduct = async function() {
            const id = document.getElementById("editing-product-id").value;
            const name = document.getElementById("prod-name").value.trim();
            const price = Number(document.getElementById("prod-price").value);
            const image = document.getElementById("prod-image").value.trim();
            const category = document.getElementById("prod-category").value;
            const description = document.getElementById("prod-desc").value.trim();

            if (!name || !price || !image) {
                alert("يرجى إكمال الحقول الأساسية (الاسم، السعر، ورابط الصورة).");
                return;
            }

            const productData = { name, price, image, category, description };

            try {
                if (id) {
                    await updateDoc(doc(db, "products", id), productData);
                    alert("تم تعديل المنتج بنجاح!");
                } else {
                    await addDoc(collection(db, "products"), productData);
                    alert("تم إضافة المنتج بنجاح!");
                }
                cancelEdit();
                loadAdminProducts();
            } catch (err) {
                console.error(err);
                alert("حدث خطأ أثناء حفظ المنتج.");
            }
        }

        async function loadAdminProducts() {
            const tbody = document.getElementById("admin-products-list");
            try {
                const snapshot = await getDocs(collection(db, "products"));
                if (snapshot.empty) {
                    tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: #888;">لا توجد منتجات مضافة حتى الآن.</td></tr>`;
                    return;
                }

                let html = "";
                snapshot.forEach(docSnap => {
                    const p = docSnap.data();
                    const catNameMap = {
                        'tshirt': 'تيشرتات',
                        'pants': 'بنطلونات',
                        'hoodie': 'هوديز',
                        'shorts': 'شورتات',
                        'suits': 'بدلات (سوتس)'
                    };
                    html += `
                        <tr>
                            <td><img src="${p.image || ''}" alt=""></td>
                            <td>${p.name}</td>
                            <td>${p.price} ج.م</td>
                            <td>${catNameMap[p.category] || p.category}</td>
                            <td>
                                <div class="actions-cell">
                                    <button class="action-btn btn-success" onclick="quickUpdatePrice('${docSnap.id}', ${p.price})">تعديل السعر</button>
                                    <button class="action-btn btn" onclick="editProduct('${docSnap.id}', '${p.name.replace(/'/g, "\\'")}', ${p.price}, '${p.image}', '${p.category}', '${(p.description || '').replace(/'/g, "\\'")}')">تعديل الكل</button>
                                    <button class="action-btn btn-danger" onclick="deleteProduct('${docSnap.id}')">حذف</button>
                                </div>
                            </td>
                        </tr>
                    `;
                });
                tbody.innerHTML = html;
            } catch (err) {
                console.error(err);
                tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: var(--danger-color);">تعذر تحميل المنتجات.</td></tr>`;
            }
        }

        // دالة لتعديل السعر بسرعة من الجدول مباشرة
        window.quickUpdatePrice = async function(id, currentPrice) {
            const newPriceStr = prompt("أدخل السعر الجديد للمنتج (ج.م):", currentPrice);
            if (newPriceStr === null) return; // لو المستخدم عمل إلغاء

            const newPrice = Number(newPriceStr);
            if (isNaN(newPrice) || newPrice <= 0) {
                alert("يرجى إدخال رقم صحيح وموجب للسعر.");
                return;
            }

            try {
                await updateDoc(doc(db, "products", id), { price: newPrice });
                alert("تم تحديث السعر بنجاح!");
                loadAdminProducts();
            } catch (err) {
                console.error(err);
                alert("حدث خطأ أثناء تحديث السعر.");
            }
        }

        window.editProduct = function(id, name, price, image, category, description) {
            document.getElementById("editing-product-id").value;
            document.getElementById("editing-product-id").value = id;
            document.getElementById("prod-name").value = name;
            document.getElementById("prod-price").value = price;
            document.getElementById("prod-image").value = image;
            document.getElementById("prod-category").value = category;
            document.getElementById("prod-desc").value = description;

            document.getElementById("form-section-title").textContent = "تعديل المنتج";
            document.getElementById("save-product-btn").textContent = "حفظ التعديلات";
            document.getElementById("cancel-edit-btn").style.display = "inline-block";
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.cancelEdit = function() {
            document.getElementById("editing-product-id").value = "";
            document.getElementById("prod-name").value = "";
            document.getElementById("prod-price").value = "";
            document.getElementById("prod-image").value = "";
            document.getElementById("prod-category").value = "tshirt";
            document.getElementById("prod-desc").value = "";

            document.getElementById("form-section-title").textContent = "إضافة منتج جديد";
            document.getElementById("save-product-btn").textContent = "إضافة المنتج";
            document.getElementById("cancel-edit-btn").style.display = "none";
        }

        window.deleteProduct = async function(id) {
            if (confirm("هل أنت متأكد من حذف هذا المنتج نهائياً؟")) {
                try {
                    await deleteDoc(doc(db, "products", id));
                    alert("تم حذف المنتج بنجاح.");
                    loadAdminProducts();
                } catch (err) {
                    console.error(err);
                    alert("حدث خطأ أثناء حذف المنتج.");
                }
            }
        }

        initAdmin();
    </script>
</body>
</html>
