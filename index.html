<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر دكن - Dakn</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #000000;
            --border-color: #e5e5e5;
            --gray-light: #f9f9f9;
        }
        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        /* الشريط العلوي النظيف */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 30px;
            border-bottom: 1px solid var(--border-color);
            background: #fff;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .header-left, .header-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .brand-name {
            font-size: 1.5rem;
            font-weight: 700;
            text-decoration: none;
            color: var(--text-color);
            letter-spacing: 1px;
        }
        .icon-btn {
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            color: var(--text-color);
        }
        .search-box {
            display: flex;
            align-items: center;
            background: var(--gray-light);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 5px 15px;
        }
        .search-box input {
            border: none;
            background: transparent;
            outline: none;
            font-family: 'Cairo', sans-serif;
            font-size: 0.9rem;
            color: var(--text-color);
            padding: 3px;
        }

        /* القائمة الجانبية */
        .sidebar {
            position: fixed;
            top: 0;
            right: -300px;
            width: 280px;
            height: 100%;
            background: #fff;
            border-left: 1px solid var(--border-color);
            box-shadow: -5px 0 15px rgba(0,0,0,0.05);
            transition: right 0.3s ease;
            z-index: 2000;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 30px 20px;
            box-sizing: border-box;
        }
        .sidebar.open { right: 0; }
        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        .sidebar-links {
            list-style: none;
            padding: 0;
            margin: 0;
            flex-grow: 1;
        }
        .sidebar-links li {
            margin-bottom: 15px;
        }
        .sidebar-links a {
            text-decoration: none;
            color: var(--text-color);
            font-size: 1.1rem;
            font-weight: 600;
            display: block;
            transition: color 0.2s;
        }
        .sidebar-links a:hover { color: #555; }
        .sidebar-footer {
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .social-link {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--text-color);
            font-weight: 600;
        }

        /* الواجهة الرئيسية (Hero Section) */
        .hero {
            position: relative;
            height: 75vh;
            background: url('https://images.unsplash.com/photo-1441986300917-64674bd600d8?auto=format&fit=crop&w=1200&q=80') center/cover no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #fff;
        }
        .hero::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4);
        }
        .hero-content {
            position: relative;
            z-index: 10;
            max-width: 600px;
            padding: 0 20px;
        }
        .hero-content h1 {
            font-size: 2.8rem;
            margin-bottom: 20px;
            font-weight: 700;
        }
        .hero-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
        }
        .btn {
            background: #fff;
            color: #000;
            border: 2px solid #fff;
            padding: 12px 25px;
            border-radius: 30px;
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            font-size: 0.95rem;
        }
        .btn:hover {
            background: transparent;
            color: #fff;
        }

        /* أقسام المنتجات التبويبية */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 50px 20px;
        }
        .section-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 25px;
            border-bottom: 2px solid var(--text-color);
            display: inline-block;
            padding-bottom: 5px;
        }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 30px;
            margin-bottom: 40px;
        }
        .product-card {
            border: 1px solid var(--border-color);
            border-radius: 10px;
            overflow: hidden;
            background: #fff;
            transition: transform 0.2s;
        }
        .product-card:hover { transform: translateY(-5px); }
        .product-img {
            width: 100%;
            height: 320px;
            object-fit: cover;
        }
        .product-info {
            padding: 15px;
            text-align: center;
        }
        .product-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 10px;
        }
        .product-price {
            font-size: 1rem;
            font-weight: 700;
            color: #333;
            margin-bottom: 15px;
        }
        .show-all-container {
            text-align: center;
            margin-bottom: 60px;
        }
        .btn-outline {
            background: transparent;
            color: var(--text-color);
            border: 2px solid var(--text-color);
            padding: 10px 30px;
            border-radius: 30px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-outline:hover {
            background: var(--text-color);
            color: #fff;
        }

        /* فوتر الصفحة */
        footer {
            border-top: 1px solid var(--border-color);
            padding: 40px 20px;
            text-align: center;
            background: var(--gray-light);
            font-size: 0.95rem;
        }
        footer p { margin: 5px 0; }

        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            z-index: 1500;
        }
        .overlay.active { display: block; }
    </style>
</head>
<body>

    <!-- الشريط العلوي -->
    <header>
        <div class="header-left">
            <button class="icon-btn" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></button>
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="search-input" placeholder="بحث عن منتج...">
            </div>
        </div>
        <a href="index.html" class="brand-name">DAKN</a>
        <div class="header-right">
            <button class="icon-btn" onclick="openCartModal()"><i class="fa-solid fa-bag-shopping"></i></button>
        </div>
    </header>

    <!-- القائمة الجانبية -->
    <div class="sidebar" id="sidebar">
        <div>
            <div class="sidebar-header">
                <h3>القائمة</h3>
                <button class="icon-btn" onclick="toggleSidebar()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <ul class="sidebar-links">
                <li><a href="#" onclick="filterByCategory('tshirt'); toggleSidebar();">T-Shirts</a></li>
                <li><a href="#" onclick="filterByCategory('hoodie'); toggleSidebar();">Hoodies</a></li>
                <li><a href="#" onclick="filterByCategory('pants'); toggleSidebar();">Pants</a></li>
                <li><a href="#" onclick="filterByCategory('shorts'); toggleSidebar();">Shorts</a></li>
                <li><a href="#" onclick="filterByCategory('suits'); toggleSidebar();">Suits</a></li>
                <li><a href="admin.html">لوحة التحكم</a></li>
            </ul>
        </div>
        <div class="sidebar-footer">
            <a href="https://instagram.com" target="_blank" class="social-link">
                <i class="fa-brands fa-instagram" style="font-size: 1.3rem;"></i> Instagram
            </a>
            <a href="https://wa.me/201234567890" target="_blank" class="social-link">
                <i class="fa-brands fa-whatsapp" style="font-size: 1.3rem; color: #25d366;"></i> 01234567890
            </a>
        </div>
    </div>
    <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

    <!-- واجهة الموقع الرئيسية (Hero) -->
    <div class="hero">
        <div class="hero-content">
            <h1>اكتشف تشكيلة الموسم الجديد</h1>
            <div class="hero-buttons">
                <a href="#shop-section" class="btn" onclick="showAllProducts()">Shop All</a>
                <a href="#shop-section" class="btn" onclick="showNewArrivals()">New Arrivals</a>
            </div>
        </div>
    </div>

    <!-- محتوى المتجر وتبويبات الأقسام -->
    <div class="container" id="shop-section">
        <div id="dynamic-sections">
            <p style="text-align: center; font-size: 1.2rem;">جاري تحميل المنتجات...</p>
        </div>
    </div>

    <!-- فوتر الموقع -->
    <footer>
        <p>جميع الحقوق محفوظة لبراند <strong>DAKN</strong> © 2026</p>
        <p>الاسترجاع والاستبدال خلال 14 يوم من تاريخ الاستلام.</p>
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAeCLqtBvTvk430tgAIBRLu_r7nCFKu4ao",
            authDomain: "dakn-store.firebaseapp.com",
            projectId: "dakn-store",
            storageBucket: "dakn-store.firebasestorage.app",
            messagingSenderId: "89276988534",
            appId: "1:89276988534:web:9be7e75cb86ef815b63357",
            measurementId: "G-YNQGQ4J125"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let allProducts = [];

        async function loadStoreProducts() {
            try {
                const snapshot = await getDocs(collection(db, "products"));
                allProducts = [];
                snapshot.forEach(docSnap => {
                    allProducts.push({ id: docSnap.id, ...docSnap.data() });
                });
                renderSections(allProducts);
            } catch (err) {
                console.error(err);
                document.getElementById("dynamic-sections").innerHTML = `<p style="text-align: center;">تعذر تحميل المنتجات.</p>`;
            }
        }

        window.renderSections = function(productsToDisplay) {
            const container = document.getElementById("dynamic-sections");
            if (productsToDisplay.length === 0) {
                container.innerHTML = `<p style="text-align: center; font-size: 1.2rem;">لا توجد منتجات مضافة حالياً.</p>`;
                return;
            }

            const categories = {
                'tshirt': 'T-Shirts',
                'hoodie': 'Hoodies',
                'pants': 'Pants',
                'shorts': 'Shorts',
                'suits': 'Suits'
            };

            let html = '';
            for (const [catKey, catName] of Object.entries(categories)) {
                const catProducts = productsToDisplay.filter(p => p.category === catKey);
                if (catProducts.length === 0) continue;

                const displayedProducts = catProducts.slice(0, 4);

                html += `
                    <div style="margin-bottom: 50px;">
                        <h2 class="section-title">${catName}</h2>
                        <div class="products-grid">
                `;

                displayedProducts.forEach(p => {
                    html += `
                        <div class="product-card">
                            <img src="${p.image || ''}" class="product-img" alt="${p.name}">
                            <div class="product-info">
                                <div class="product-title">${p.name}</div>
                                <div class="product-price">${p.price} ج.م</div>
                            </div>
                        </div>
                    `;
                });

                html += `
                        </div>
                `;

                if (catProducts.length > 4) {
                    html += `
                        <div class="show-all-container">
                            <button class="btn-outline" onclick="filterByCategory('${catKey}')">Show All ${catName}</button>
                        </div>
                    `;
                }

                html += `</div>`;
            }

            container.innerHTML = html;
        }

        window.showAllProducts = function() {
            renderSections(allProducts);
        }

        window.showNewArrivals = function() {
            // منتجات تم إضافتها حديثاً (مثال افتراضي أو عشوائي لآخر العناصر)
            const newProds = allProducts.slice(-4);
            renderSections(newProds);
        }

        window.filterByCategory = function(categoryKey) {
            const container = document.getElementById("dynamic-sections");
            const filtered = allProducts.filter(p => p.category === categoryKey);
            
            const categoriesMap = { 'tshirt': 'T-Shirts', 'hoodie': 'Hoodies', 'pants': 'Pants', 'shorts': 'Shorts', 'suits': 'Suits' };
            
            let html = `
                <div style="margin-bottom: 30px;">
                    <button class="btn-outline" onclick="showAllProducts()" style="margin-bottom: 20px;">← العودة لكل الأقسام</button>
                    <h2 class="section-title">${categoriesMap[categoryKey] || categoryKey}</h2>
                    <div class="products-grid">
            `;

            filtered.forEach(p => {
                html += `
                    <div class="product-card">
                        <img src="${p.image || ''}" class="product-img" alt="${p.name}">
                        <div class="product-info">
                            <div class="product-title">${p.name}</div>
                            <div class="product-price">${p.price} ج.م</div>
                        </div>
                    </div>
                `;
            });

            html += `</div></div>`;
            container.innerHTML = html;
            window.scrollTo({ top: document.getElementById('shop-section').offsetTop - 80, behavior: 'smooth' });
        }

        window.toggleSidebar = function() {
            document.getElementById("sidebar").classList.toggle("open");
            document.getElementById("overlay").classList.toggle("active");
        }

        window.openCartModal = function() {
            alert("عربة التسوق فارغة حالياً.");
        }

        loadStoreProducts();
    </script>
</body>
</html>
