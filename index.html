<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAKN Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #000000;
            --border-color: #e5e5e5;
            --gray-light: #f9f9f9;
        }
        * { box-sizing: border-box; scroll-behavior: smooth; }
        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            text-align: right;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            border-bottom: 1px solid var(--border-color);
            background: #fff;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .header-left, .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .brand-name {
            font-size: 1.3rem;
            font-weight: 700;
            text-decoration: none;
            color: var(--text-color);
            letter-spacing: 1px;
        }
        .icon-btn {
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            color: var(--text-color);
            padding: 5px;
            position: relative;
        }
        .cart-badge {
            position: absolute;
            top: 0;
            right: 0;
            background: #000;
            color: #fff;
            font-size: 0.65rem;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .search-box {
            display: flex;
            align-items: center;
            background: var(--gray-light);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 4px 12px;
            max-width: 150px;
        }
        @media(min-width: 768px) {
            .search-box { max-width: 250px; }
            header { padding: 20px 40px; }
            .brand-name { font-size: 1.5rem; }
        }
        .search-box input {
            border: none;
            background: transparent;
            outline: none;
            font-family: 'Cairo', sans-serif;
            font-size: 0.85rem;
            color: var(--text-color);
            padding: 2px;
            width: 100%;
        }

        .sidebar {
            position: fixed;
            top: 0;
            right: -100%;
            width: 280px;
            height: 100%;
            background: #fff;
            border-left: 1px solid var(--border-color);
            box-shadow: -5px 0 15px rgba(0,0,0,0.05);
            transition: right 0.3s ease;
            z-index: 4000;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 30px 20px;
        }
        .sidebar.open { right: 0; }
        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        .sidebar-links {
            list-style: none;
            padding: 0;
            margin: 0;
            flex-grow: 1;
        }
        .sidebar-links li { margin-bottom: 15px; }
        .sidebar-links a {
            text-decoration: none;
            color: var(--text-color);
            font-size: 1.1rem;
            font-weight: 600;
            display: block;
        }
        .sidebar-footer {
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .social-link {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--text-color);
            font-weight: 600;
        }

        .hero {
            position: relative;
            height: 60vh;
            min-height: 400px;
            background: url('https://images.unsplash.com/photo-1441986300917-64674bd600d8?auto=format&fit=crop&w=1200&q=80') center/cover no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #fff;
            overflow: hidden;
        }
        @media(min-width: 768px) { .hero { height: 75vh; } }
        .hero::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.45);
        }
        .hero-content {
            position: relative;
            z-index: 10;
            max-width: 600px;
            padding: 0 20px;
        }
        .hero-content h1 {
            font-size: 2rem;
            margin-bottom: 20px;
            font-weight: 700;
        }
        @media(min-width: 768px) { .hero-content h1 { font-size: 2.8rem; } }
        .hero-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            background: #fff;
            color: #000;
            border: 2px solid #fff;
            padding: 10px 20px;
            border-radius: 30px;
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .btn:hover { background: transparent; color: #fff; transform: translateY(-2px); }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 15px;
        }
        @media(min-width: 768px) { .container { padding: 50px 20px; } }
        .section-title {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--text-color);
            display: inline-block;
            padding-bottom: 5px;
        }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }
        @media(min-width: 768px) {
            .products-grid { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 30px; }
        }
        .product-card {
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            background: #fff;
            transition: transform 0.2s;
            cursor: pointer;
        }
        .product-card:hover { transform: translateY(-3px); }
        .product-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        @media(min-width: 768px) { .product-img { height: 320px; } }
        .product-info { padding: 10px; text-align: right; }
        .product-title { font-size: 0.95rem; font-weight: 600; margin-bottom: 6px; }
        .product-price { font-size: 0.9rem; font-weight: 700; color: #333; margin-bottom: 10px; }
        .btn-outline {
            background: transparent;
            color: var(--text-color);
            border: 2px solid var(--text-color);
            padding: 8px 25px;
            border-radius: 30px;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .btn-outline:hover { background: var(--text-color); color: #fff; }

        .show-more-link {
            background: none;
            border: none;
            color: var(--text-color);
            font-family: 'Cairo', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: underline;
            padding: 0;
            display: inline-block;
        }
        .show-more-link:hover { opacity: 0.7; }

        .product-detail-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 30px;
            margin-top: 20px;
        }
        @media(min-width: 768px) {
            .product-detail-container { grid-template-columns: 1fr 1fr; align-items: start; }
        }
        .detail-img {
            width: 100%;
            height: 400px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }
        @media(min-width: 768px) { .detail-img { height: 500px; } }
        .size-selector {
            display: flex;
            gap: 10px;
            margin: 15px 0;
        }
        .size-btn {
            border: 1px solid var(--border-color);
            background: #fff;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            font-weight: 600;
        }
        .size-btn.active {
            border-color: #000;
            background: #000;
            color: #fff;
        }
        .qty-box {
            display: flex;
            align-items: center;
            gap: 15px;
            margin: 20px 0;
        }
        .qty-btn {
            background: var(--gray-light);
            border: 1px solid var(--border-color);
            width: 35px; height: 35px;
            font-weight: 700;
            cursor: pointer;
            border-radius: 4px;
        }

        .cart-modal {
            position: fixed;
            top: 0; left: -100%;
            width: 100%; max-width: 400px;
            height: 100%;
            background: #fff;
            box-shadow: 5px 0 20px rgba(0,0,0,0.1);
            z-index: 5000;
            transition: left 0.3s ease;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }
        .cart-modal.open { left: 0; }
        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 15px;
        }
        .cart-items { flex-grow: 1; overflow-y: auto; }
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--gray-light);
            padding-bottom: 10px;
        }
        .cart-footer {
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
        }
        .checkout-form input {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-family: 'Cairo', sans-serif;
            text-align: right;
        }

        #toast-notification {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #ffffff;
            color: #111111;
            border: 1px solid #e0e0e0;
            padding: 14px 28px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            z-index: 999999;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
            text-align: center;
        }
        #toast-notification.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        footer {
            border-top: 1px solid var(--border-color);
            padding: 30px 15px;
            text-align: center;
            background: var(--gray-light);
            font-size: 0.85rem;
        }
        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            z-index: 3000;
        }
        .overlay.active { display: block; }
    </style>
</head>
<body>

    <div id="toast-notification"></div>

    <header>
        <div class="header-left">
            <button class="icon-btn" onclick="toggleCart()">
                <i class="fa-solid fa-bag-shopping"></i>
                <span class="cart-badge" id="cart-count">0</span>
            </button>
            <div class="search-box">
                <input type="text" id="search-input" placeholder="بحث..." oninput="handleSearch(this.value)">
                <i class="fa-solid fa-magnifying-glass"></i>
            </div>
        </div>
        <a href="#" onclick="initStore(); return false;" class="brand-name">DAKN</a>
        <div class="header-right">
            <button class="icon-btn" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></button>
        </div>
    </header>

    <div class="sidebar" id="sidebar">
        <div>
            <div class="sidebar-header">
                <h3>القائمة</h3>
                <button class="icon-btn" onclick="toggleSidebar()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <ul class="sidebar-links">
                <li><a href="#" onclick="filterByCategory('tshirt'); toggleSidebar();">تيشيرتات</a></li>
                <li><a href="#" onclick="filterByCategory('hoodie'); toggleSidebar();">هوديز</a></li>
                <li><a href="#" onclick="filterByCategory('pants'); toggleSidebar();">بناطيل</a></li>
                <li><a href="#" onclick="filterByCategory('shorts'); toggleSidebar();">شورتات</a></li>
                <li><a href="#" onclick="filterByCategory('suits'); toggleSidebar();">بدل</a></li>
                <li><a href="admin.html">لوحة التحكم</a></li>
            </ul>
        </div>
        <div class="sidebar-footer">
            <a href="https://instagram.com" target="_blank" class="social-link"><i class="fa-brands fa-instagram" style="font-size: 1.3rem;"></i> انستجرام</a>
            <a href="https://wa.me/201234567890" target="_blank" class="social-link"><i class="fa-brands fa-whatsapp" style="font-size: 1.3rem; color: #25d366;"></i> 01234567890</a>
        </div>
    </div>

    <div class="cart-modal" id="cartModal">
        <div class="cart-header">
            <h3>سلة المشتريات</h3>
            <button class="icon-btn" onclick="toggleCart()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="cart-items" id="cart-items-container">
            <p style="text-align: center; color: #777;">السلة فارغة</p>
        </div>
        <div class="cart-footer">
            <div style="display: flex; justify-content: space-between; font-weight: 700; margin-bottom: 15px;">
                <span id="cart-total-price">0 ج.م</span>
                <span>الإجمالي:</span>
            </div>
            <div class="checkout-form">
                <input type="text" id="buyer-name" placeholder="اسمك الكريم">
                <input type="tel" id="buyer-phone" placeholder="رقم الهاتف">
                <button class="btn" style="width: 100%; background: #25d366; border-color: #25d366; color: #fff;" onclick="sendOrderWhatsApp()">
                    <i class="fa-brands fa-whatsapp"></i> اطلب عبر الواتساب
                </button>
            </div>
        </div>
    </div>

    <div class="overlay" id="overlay" onclick="closeAllModals()"></div>

    <div class="hero" id="hero-section">
        <div class="hero-content">
            <h1>اكتشف تشكيلة DAKN الجديدة</h1>
            <div class="hero-buttons">
                <a href="#shop-section" class="btn" onclick="showNewArrivals()">وصل حديثاً</a>
                <a href="#shop-section" class="btn" onclick="renderShopAll()">تسوق الكل</a>
            </div>
        </div>
    </div>

    <div class="container" id="shop-section">
        <div id="dynamic-content">
            <p style="text-align: center;">جاري تحميل المنتجات...</p>
        </div>
    </div>

    <footer>
        <p>جميع الحقوق محفوظة <strong>DAKN</strong> © 2026</p>
        <p>سياسة الاستبدال والاسترجاع خلال 14 يوم.</p>
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAeCLqtBvTvk430tgAIBRLu_r7nCFKu4ao",
            authDomain: "dakn-store.firebaseapp.com",
            projectId: "dakn-store",
            storageBucket: "dakn-store.firebasestorage.app",
            messagingSenderId: "89276988534",
            appId: "1:89276988534:web:9be7e75cb86ef815b63357",
            measurementId: "G-YNQGQ4J125"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let allProducts = [];
        let cart = JSON.parse(localStorage.getItem("dakn_cart")) || [];

        window.showToast = function(message) {
            const toast = document.getElementById("toast-notification");
            toast.textContent = message;
            toast.classList.add("show");
            setTimeout(() => { toast.classList.remove("show"); }, 3000);
        }

        window.initStore = async function() {
            try {
                const snapshot = await getDocs(collection(db, "products"));
                allProducts = [];
                snapshot.forEach(docSnap => {
                    allProducts.push({ id: docSnap.id, ...docSnap.data() });
                });
                renderHomeGrid(allProducts);
                updateCartBadge();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } catch (err) {
                console.error(err);
                document.getElementById("dynamic-content").innerHTML = `<p style="text-align: center; color: red;">فشل تحميل المنتجات.</p>`;
            }
        }

        window.renderHomeGrid = function(products) {
            document.getElementById("hero-section").style.display = "flex";
            const container = document.getElementById("dynamic-content");

            if (products.length === 0) {
                container.innerHTML = `<p style="text-align: center;">لا توجد منتجات متاحة حالياً.</p>`;
                return;
            }

            let html = `
                <div style="margin-bottom: 30px;">
                    <h2 class="section-title">تسوق الكل</h2>
                    <div class="products-grid">
            `;

            products.slice(0, 4).forEach(p => {
                html += `
                    <div class="product-card" onclick="openProductDetail('${p.id}')">
                        <img src="${p.image || ''}" class="product-img" alt="${p.name}">
                        <div class="product-info">
                            <div class="product-title">${p.name}</div>
                            <div class="product-price">${p.price} ج.م</div>
                        </div>
                    </div>
                `;
            });

            html += `</div>`;
            if (products.length > 4) {
                html += `<div style="text-align: right;"><button class="show-more-link" onclick="renderShopAll()">عرض المزيد</button></div>`;
            }
            html += `</div>`;
            container.innerHTML = html;
        }

        window.renderShopAll = function() {
            document.getElementById("hero-section").style.display = "none";
            const container = document.getElementById("dynamic-content");

            let html = `
                <button class="btn-outline" onclick="initStore()" style="margin-bottom: 20px;">← العودة للمتجر</button>
                <div style="margin-bottom: 30px;">
                    <h2 class="section-title">جميع المنتجات</h2>
                    <div class="products-grid">
            `;

            allProducts.forEach(p => {
                html += `
                    <div class="product-card" onclick="openProductDetail('${p.id}')">
                        <img src="${p.image || ''}" class="product-img" alt="${p.name}">
                        <div class="product-info">
                            <div class="product-title">${p.name}</div>
                            <div class="product-price">${p.price} ج.م</div>
                        </div>
                    </div>
                `;
            });

            html += `</div></div>`;
            container.innerHTML = html;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.showNewArrivals = function() {
            document.getElementById("hero-section").style.display = "none";
            const container = document.getElementById("dynamic-content");
            const newProducts = [...allProducts].reverse().slice(0, 8);

            let html = `
                <button class="btn-outline" onclick="initStore()" style="margin-bottom: 20px;">← العودة للمتجر</button>
                <div style="margin-bottom: 30px;">
                    <h2 class="section-title">وصل حديثاً</h2>
                    <div class="products-grid">
            `;

            newProducts.forEach(p => {
                html += `
                    <div class="product-card" onclick="openProductDetail('${p.id}')">
                        <img src="${p.image || ''}" class="product-img" alt="${p.name}">
                        <div class="product-info">
                            <div class="product-title">${p.name}</div>
                            <div class="product-price">${p.price} ج.م</div>
                        </div>
                    </div>
                `;
            });

            html += `</div></div>`;
            container.innerHTML = html;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.filterByCategory = function(category) {
            document.getElementById("hero-section").style.display = "none";
            const container = document.getElementById("dynamic-content");
            const filtered = allProducts.filter(p => p.category && p.category.toLowerCase() === category.toLowerCase());

            let html = `
                <button class="btn-outline" onclick="initStore()" style="margin-bottom: 20px;">← العودة للمتجر</button>
                <div style="margin-bottom: 30px;">
                    <h2 class="section-title">${category.toUpperCase()}</h2>
                    <div class="products-grid">
            `;

            if (filtered.length === 0) {
                html += `<p>لا توجد منتجات في هذا القسم.</p>`;
            } else {
                filtered.forEach(p => {
                    html += `
                        <div class="product-card" onclick="openProductDetail('${p.id}')">
                            <img src="${p.image || ''}" class="product-img" alt="${p.name}">
                            <div class="product-info">
                                <div class="product-title">${p.name}</div>
                                <div class="product-price">${p.price} ج.م</div>
                            </div>
                        </div>
                    `;
                });
            }

            html += `</div></div>`;
            container.innerHTML = html;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.openProductDetail = async function(id) {
            document.getElementById("hero-section").style.display = "none";
            const container = document.getElementById("dynamic-content");
            container.innerHTML = `<p style="text-align: center;">جاري تحميل تفاصيل المنتج...</p>`;

            try {
                const docRef = doc(db, "products", id);
                const docSnap = await getDoc(docRef);

                if (!docSnap.exists()) {
                    container.innerHTML = `<p style="text-align: center;">المنتج غير موجود.</p>`;
                    return;
                }

                const p = { id: docSnap.id, ...docSnap.data() };
                const sizes = p.sizes ? p.sizes.split(",") : ["S", "M", "L", "XL"];

                let html = `
                    <button class="btn-outline" onclick="initStore()" style="margin-bottom: 20px;">← العودة للمتجر</button>
                    <div class="product-detail-container">
                        <div>
                            <img src="${p.image || ''}" class="detail-img" alt="${p.name}">
                        </div>
                        <div style="text-align: right;">
                            <h2 style="font-size: 1.8rem; margin-bottom: 10px;">${p.name}</h2>
                            <p style="font-size: 1.3rem; font-weight: 700; margin-bottom: 15px;">${p.price} ج.م</p>
                            <p style="color: #555; margin-bottom: 20px; line-height: 1.6;">${p.description || 'تصميم أنيق وعالي الجودة من DAKN.'}</p>
                            
                            <div style="font-weight: 600; margin-bottom: 5px;">اختر المقاس:</div>
                            <div class="size-selector" id="size-selector">
                                ${sizes.map((s, idx) => `<button class="size-btn ${idx === 0 ? 'active' : ''}" onclick="selectSize(this)">${s.trim()}</button>`).join('')}
                            </div>

                            <div style="font-weight: 600; margin-bottom: 5px;">الكمية:</div>
                            <div class="qty-box">
                                <button class="qty-btn" onclick="changeQty(1)">+</button>
                                <span id="product-qty" style="font-weight: 700; font-size: 1.1rem;">1</span>
                                <button class="qty-btn" onclick="changeQty(-1)">-</button>
                            </div>

                            <button class="btn" style="width: 100%; background: #000; color: #fff; padding: 12px; margin-top: 10px;" onclick="addToCart('${p.id}', '${p.name}', ${p.price}, '${p.image || ''}')">
                                إضافة إلى السلة
                            </button>
                        </div>
                    </div>
                `;
                container.innerHTML = html;
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } catch (err) {
                console.error(err);
                container.innerHTML = `<p style="text-align: center; color: red;">خطأ في تحميل تفاصيل المنتج.</p>`;
            }
        }

        window.selectSize = function(btn) {
            const parent = btn.parentElement;
            parent.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        window.changeQty = function(val) {
            const qtySpan = document.getElementById("product-qty");
            let qty = parseInt(qtySpan.textContent) + val;
            if (qty < 1) qty = 1;
            qtySpan.textContent = qty;
        }

        window.addToCart = function(id, name, price, image) {
            const activeSizeBtn = document.querySelector('.size-btn.active');
            const size = activeSizeBtn ? activeSizeBtn.textContent : 'M';
            const qty = parseInt(document.getElementById("product-qty").textContent);

            const existingIndex = cart.findIndex(item => item.id === id && item.size === size);
            if (existingIndex > -1) {
                cart[existingIndex].qty += qty;
            } else {
                cart.push({ id, name, price, image, size, qty });
            }

            localStorage.setItem("dakn_cart", JSON.stringify(cart));
            updateCartBadge();
            showToast("تمت إضافة المنتج إلى السلة بنجاح!");
        }

        window.updateCartBadge = function() {
            const totalQty = cart.reduce((sum, item) => sum + item.qty, 0);
            document.getElementById("cart-count").textContent = totalQty;
        }

        window.toggleCart = function() {
            const modal = document.getElementById("cartModal");
            const overlay = document.getElementById("overlay");
            modal.classList.toggle("open");
            overlay.classList.toggle("active");
            if (modal.classList.contains("open")) {
                renderCartItems();
            }
        }

        window.closeAllModals = function() {
            document.getElementById("cartModal").classList.remove("open");
            document.getElementById("sidebar").classList.remove("open");
            document.getElementById("overlay").classList.remove("active");
        }

        window.toggleSidebar = function() {
            const sidebar = document.getElementById("sidebar");
            const overlay = document.getElementById("overlay");
            sidebar.classList.toggle("open");
            overlay.classList.toggle("active");
        }

        window.renderCartItems = function() {
            const container = document.getElementById("cart-items-container");
            const totalPriceEl = document.getElementById("cart-total-price");

            if (cart.length === 0) {
                container.innerHTML = `<p style="text-align: center; color: #777;">السلة فارغة</p>`;
                totalPriceEl.textContent = "0 ج.م";
                return;
            }

            let html = "";
            let total = 0;

            cart.forEach((item, index) => {
                total += item.price * item.qty;
                html += `
                    <div class="cart-item">
                        <button class="icon-btn" onclick="removeFromCart(${index})" style="color: red;"><i class="fa-solid fa-trash"></i></button>
                        <div style="flex-grow: 1; padding: 0 10px; text-align: right;">
                            <div style="font-size: 0.9rem; font-weight: 600;">${item.name}</div>
                            <div style="font-size: 0.8rem; color: #555;">المقاس: ${item.size} | الكمية: ${item.qty}</div>
                            <div style="font-size: 0.85rem; font-weight: 700;">${item.price * item.qty} ج.م</div>
                        </div>
                        <img src="${item.image}" style="width: 50px; height: 50px; object-fit: cover; border-radius: 4px;">
                    </div>
                `;
            });

            container.innerHTML = html;
            totalPriceEl.textContent = total + " ج.م";
        }

        window.removeFromCart = function(index) {
            cart.splice(index, 1);
            localStorage.setItem("dakn_cart", JSON.stringify(cart));
            updateCartBadge();
            renderCartItems();
            showToast("تم إزالة المنتج من السلة.");
        }

        window.sendOrderWhatsApp = function() {
            const name = document.getElementById("buyer-name").value.trim();
            const phone = document.getElementById("buyer-phone").value.trim();

            if (!name || !phone) {
                showToast("الرجاء إدخال الاسم ورقم الهاتف.");
                return;
            }

            if (cart.length === 0) {
                showToast("سلة المشتريات فارغة.");
                return;
            }

            let message = `طلب جديد من متجر DAKN:\nالاسم: ${name}\nالهاتف: ${phone}\n\nالمنتجات:\n`;
            let total = 0;

            cart.forEach(item => {
                message += `- ${item.name} (المقاس: ${item.size}) × ${item.qty} = ${item.price * item.qty} ج.م\n`;
                total += item.price * item.qty;
            });

            message += `\nإجمالي المبلغ: ${total} ج.م`;

            const encodedMessage = encodeURIComponent(message);
            window.open(`https://wa.me/201234567890?text=${encodedMessage}`, '_blank');
        }

        window.handleSearch = function(query) {
            if (!query.trim()) {
                initStore();
                return;
            }
            const q = query.toLowerCase();
            const filtered = allProducts.filter(p => p.name.toLowerCase().includes(q));
            renderHomeGrid(filtered);
        }

        initStore();
    </script>
</body>
</html>
