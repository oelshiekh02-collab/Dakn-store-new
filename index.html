<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر دكن - Dakn Store</title>
    <!-- استدعاء خط Cairo العربي الفخم -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f0f0f;
            --card-bg: #1a1a1a;
            --text-color: #f5f5f5;
            --accent-color: #d4a373;
            --border-color: #333333;
            --whatsapp-color: #25d366;
        }
        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
            animation: fadeIn 0.8s ease-in-out;
        }
        h1 {
            color: var(--accent-color);
            font-size: 2.8rem;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }
        header p {
            color: #aaa;
            font-size: 1.2rem;
        }
        /* تصميم شريط العروض الفخم والمتناسق مع المتجر */
        .promo-banner {
            background: linear-gradient(135deg, #2a2218, #1a1a1a);
            border: 1px solid var(--accent-color);
            border-radius: 14px;
            padding: 20px;
            max-width: 1160px;
            margin: 0 auto 40px auto;
            text-align: center;
            box-shadow: 0 8px 25px rgba(212, 163, 115, 0.15);
            animation: fadeIn 0.8s ease-in-out;
            display: none; /* مخفي افتراضياً حتى يتم تفعيله من الأدمن */
        }
        .promo-title {
            color: var(--accent-color);
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .promo-desc {
            color: #ddd;
            font-size: 1.1rem;
            margin-bottom: 15px;
        }
        .promo-btn {
            display: inline-block;
            background-color: var(--whatsapp-color);
            color: white;
            padding: 10px 25px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 700;
            transition: transform 0.2s, background 0.2s;
        }
        .promo-btn:hover {
            background-color: #20ba5a;
            transform: scale(1.03);
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .product-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            animation: slideUp 0.6s ease-in-out;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .product-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 30px rgba(212, 163, 115, 0.15);
            border-color: var(--accent-color);
        }
        .product-card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            background-color: #222;
        }
        .product-info {
            padding: 18px;
        }
        .product-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 10px;
            color: #fff;
        }
        .product-price {
            color: var(--accent-color);
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 15px;
        }
        .whatsapp-btn {
            display: block;
            width: calc(100% - 36px);
            margin: 0 18px 18px 18px;
            padding: 12px;
            background-color: var(--whatsapp-color);
            color: white;
            text-align: center;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 700;
            transition: background 0.2s, transform 0.1s;
        }
        .whatsapp-btn:hover {
            background-color: #20ba5a;
            transform: scale(1.02);
        }
        .loading {
            text-align: center;
            grid-column: 1 / -1;
            font-size: 1.2rem;
            color: #888;
            padding: 50px;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <header>
        <h1>Dakn Store </h1>
        <p>الفخامة والأناقة في كل قطعة</p>
    </header>

    <!-- شريط العروض الفخم (يظهر تلقائياً لو تم تفعيله من الأدمن) -->
    <div id="promo-banner" class="promo-banner">
        <div id="promo-title" class="promo-title">عرض خاص لفترة محدودة 🔥</div>
        <div id="promo-text" class="promo-desc">جاري تحميل تفاصيل العرض...</div>
        <a id="promo-whatsapp-btn" href="#" target="_blank" class="promo-btn">اسأل عن العروض عبر الواتساب 💬</a>
    </div>

    <main>
        <div id="products-container" class="products-grid">
            <div class="loading">جاري تحميل المنتجات بفخامة...</div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAeCLqtBvTvk430tgAIBRLu_r7nCFKu4ao",
            authDomain: "dakn-store.firebaseapp.com",
            projectId: "dakn-store",
            storageBucket: "dakn-store.firebasestorage.app",
            messagingSenderId: "89276988534",
            appId: "1:89276988534:web:9be7e75cb86ef815b63357",
            measurementId: "G-YNQGQ4J125"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const WHATSAPP_NUMBER = "201097597133"; 

        // دالة جلب وعرض العروض والمنتجات
        async function loadStoreData() {
            // 1. جلب بيانات العرض
            try {
                const promoDocRef = doc(db, "settings", "promo");
                const promoSnap = await getDoc(promoDocRef);
                const promoBanner = document.getElementById("promo-banner");

                if (promoSnap.exists()) {
                    const promoData = promoSnap.data();
                    if (promoData.isActive) {
                        document.getElementById("promo-title").textContent = promoData.title || "عرض خاص لفترة محدودة 🔥";
                        document.getElementById("promo-text").textContent = promoData.description || "";
                        
                        const promoMessage = encodeURIComponent(`مرحباً، أود الاستفسار عن تفاصيل العرض الحالي: "${promoData.title}"`);
                        document.getElementById("promo-whatsapp-btn").href = `https://wa.me/${WHATSAPP_NUMBER}?text=${promoMessage}`;
                        
                        promoBanner.style.display = "block"; // إظهار الشريط للعميل
                    }
                }
            } catch (err) {
                console.error("خطأ في جلب العرض:", err);
            }

            // 2. جلب المنتجات
            const container = document.getElementById("products-container");
            try {
                const querySnapshot = await getDocs(collection(db, "products"));
                container.innerHTML = "";

                if (querySnapshot.empty) {
                    container.innerHTML = `<div class="loading">لا توجد منتجات مضافة حتى الآن.</div>`;
                    return;
                }

                querySnapshot.forEach((docItem) => {
                    const p = docItem.data();
                    const productName = p.name || 'بدون اسم';
                    const productPrice = p.price || 0;
                    
                    const message = encodeURIComponent(`مرحباً، أريد طلب هذا المنتج:\n- الاسم: ${productName}\n- السعر: ${productPrice} ج.م`);
                    const whatsappLink = `https://wa.me/${WHATSAPP_NUMBER}?text=${message}`;

                    const card = document.createElement("div");
                    card.className = "product-card";
                    card.innerHTML = `
                        <div>
                            <img src="${p.image || ''}" alt="${productName}" loading="lazy">
                            <div class="product-info">
                                <div class="product-title">${productName}</div>
                                <div class="product-price">${productPrice} ج.م</div>
                            </div>
                        </div>
                        <a href="${whatsappLink}" target="_blank" class="whatsapp-btn">اطلب عبر الواتساب 💬</a>
                    `;
                    container.appendChild(card);
                });
            } catch (error) {
                console.error("خطأ:", error);
                container.innerHTML = `<div class="loading" style="color: #ff6b6b;">تعذر الاتصال بقاعدة البيانات. تأكد من الإنترنت.</div>`;
            }
        }

        loadStoreData();
    </script>
</body>
</html>
