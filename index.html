<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>متجر داكن | Dakn Store</title>
  <style>
    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    * { box-sizing: border-box; font-family: system-ui, sans-serif; margin: 0; padding: 0; }
    body { background-color: #090909; color: #fff; padding: 20px; overflow-x: hidden; }
    
    header { text-align: center; padding: 30px 0; border-bottom: 1px solid #222; margin-bottom: 40px; animation: fadeInDown 0.8s ease-in-out; }
    h1 { font-size: 32px; letter-spacing: 2px; color: #fff; font-weight: 800; }
    p.subtitle { color: #888; font-size: 16px; margin-top: 5px; }

    .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; max-width: 1200px; margin: auto; }
    
    .product-card { background: #141414; border-radius: 14px; overflow: hidden; border: 1px solid #222; padding: 15px; text-align: center; animation: fadeInUp 0.8s ease-in-out; transition: transform 0.3s, box-shadow 0.3s; }
    .product-card:hover { transform: translateY(-8px); box-shadow: 0 10px 25px rgba(255,255,255,0.08); border-color: #444; }
    
    .product-card img { width: 100%; height: 260px; object-fit: cover; border-radius: 10px; margin-bottom: 15px; background: #1f1f1f; }
    .product-card h3 { font-size: 22px; margin-bottom: 8px; color: #fff; }
    .product-card p { font-size: 19px; color: #bbb; margin-bottom: 12px; font-weight: bold; }
    
    .size-box { margin-bottom: 15px; text-align: right; }
    .size-box label { font-size: 14px; color: #aaa; display: block; margin-bottom: 5px; }
    .size-select { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #333; background: #222; color: #fff; font-size: 16px; }

    .buy-btn { display: block; width: 100%; background: #fff; color: #000; padding: 14px; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 18px; transition: 0.2s; }
    .buy-btn:hover { background: #dcdcdc; transform: scale(0.98); }

    .empty-msg { grid-column: 1/-1; text-align: center; color: #666; font-size: 20px; padding: 50px; animation: fadeInUp 0.5s ease-in-out; }
  </style>
</head>
<body>

  <header>
    <h1>DAKN STORE</h1>
    <p class="subtitle">أرقى التصميمات والمنتجات الحصرية</p>
  </header>

  <main>
    <div id="productsContainer" class="products-grid">
      <div class="empty-msg">جاري تحميل المنتجات...</div>
    </div>
  </main>

  <script>
    const GITHUB_USER = "oelshiekh02-collab";
    const REPO_NAME = "Dakn-store-new";

    async function loadStoreProducts() {
      const container = document.getElementById('productsContainer');
      try {
        const response = await fetch(`https://raw.githubusercontent.com/${GITHUB_USER}/${REPO_NAME}/main/products.json?t=${new Date().getTime()}`);
        const products = await response.json();

        if (!products || products.length === 0) {
          container.innerHTML = `<div class="empty-msg">لا توجد منتجات مضافة حالياً. انتظرونا قريباً!</div>`;
          return;
        }

        container.innerHTML = '';
        products.forEach((prod, index) => {
          container.innerHTML += `
            <div class="product-card">
              <img src="${prod.image}" alt="${prod.title}">
              <h3>${prod.title}</h3>
              <p>${prod.price} جنيه</p>
              
              <div class="size-box">
                <label>اختر المقاس:</label>
                <select id="size-${index}" class="size-select">
                  <option value="Small">Small (S)</option>
                  <option value="Medium">Medium (M)</option>
                  <option value="Large" selected>Large (L)</option>
                  <option value="XLarge">XLarge (XL)</option>
                  <option value="XXLarge">XXLarge (XXL)</option>
                </select>
              </div>

              <a href="#" onclick="sendWhatsApp('${prod.title}', '${prod.price}', ${index})" class="buy-btn">اطلب عبر واتساب</a>
            </div>
          `;
        });
      } catch (error) {
        container.innerHTML = `<div class="empty-msg">لا توجد منتجات مضافة حالياً. انتظرونا قريباً!</div>`;
      }
    }

    window.sendWhatsApp = function(title, price, index) {
      const selectedSize = document.getElementById(`size-${index}`).value;
      const message = `مرحباً، أريد طلب هذا المنتج:\n\n*المنتج:* ${title}\n*السعر:* ${price} جنيه\n*المقاس:* ${selectedSize}`;
      const url = `https://wa.me/?text=${encodeURIComponent(message)}`;
      window.open(url, '_blank');
    }

    loadStoreStoreProducts = loadStoreProducts();
    loadStoreProducts();
  </script>

</body>
</html>
