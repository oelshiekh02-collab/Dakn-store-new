<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر دكن - Dakn Store</title>
    <style>
        :root {
            --bg-color: #0f0f0f;
            --card-bg: #1a1a1a;
            --text-color: #f5f5f5;
            --accent-color: #d4a373;
            --border-color: #333333;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 40px;
            animation: fadeIn 0.8s ease-in-out;
        }
        h1 {
            color: var(--accent-color);
            font-size: 2.5rem;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }
        header p {
            color: #aaa;
            font-size: 1.1rem;
        }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .product-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            animation: slideUp 0.6s ease-in-out;
        }
        .product-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 30px rgba(212, 163, 115, 0.15);
            border-color: var(--accent-color);
        }
        .product-card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            background-color: #222;
        }
        .product-info {
            padding: 18px;
        }
        .product-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 10px;
            color: #fff;
        }
        .product-price {
            color: var(--accent-color);
            font-size: 1.1rem;
            font-weight: bold;
        }
        .loading {
            text-align: center;
            grid-column: 1 / -1;
            font-size: 1.2rem;
            color: #888;
            padding: 50px;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <header>
        <h1>متجر دكن</h1>
        <p>الفخامة والأناقة في كل قطعة</p>
    </header>

    <main>
        <div id="products-container" class="products-grid">
            <div class="loading">جاري تحميل المنتجات بفخامة...</div>
        </div>
    </main>

    <!-- كود ربط وعرض منتجات Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAeCLqtBvTvk430tgAIBRLu_r7nCFKu4ao",
            authDomain: "dakn-store.firebaseapp.com",
            projectId: "dakn-store",
            storageBucket: "dakn-store.firebasestorage.app",
            messagingSenderId: "89276988534",
            appId: "1:89276988534:web:9be7e75cb86ef815b63357",
            measurementId: "G-YNQGQ4J125"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function loadProducts() {
            const container = document.getElementById("products-container");
            try {
                const querySnapshot = await getDocs(collection(db, "products"));
                container.innerHTML = "";

                if (querySnapshot.empty) {
                    container.innerHTML = `<div class="loading">لا توجد منتجات مضافة حتى الآن. اذهب للوحة التحكم لإضافة منتجاتك!</div>`;
                    return;
                }

                querySnapshot.forEach((doc) => {
                    const p = doc.data();
                    const card = document.createElement("div");
                    card.className = "product-card";
                    card.innerHTML = `
                        <img src="${p.image || ''}" alt="${p.name || 'منتج'}" loading="lazy">
                        <div class="product-info">
                            <div class="product-title">${p.name || 'بدون اسم'}</div>
                            <div class="product-price">${p.price || 0} ج.م</div>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (error) {
                console.error("خطأ:", error);
                container.innerHTML = `<div class="loading" style="color: #ff6b6b;">تعذر الاتصال بقاعدة البيانات. تأكد من الإنترنت.</div>`;
            }
        }

        loadProducts();
    </script>
</body>
</html>
