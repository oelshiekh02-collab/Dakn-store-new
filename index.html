<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر داكن - Dakn Store</title>
    <style>
        :root {
            --bg-color: #fdfbf7;
            --card-bg: #ffffff;
            --text-color: #2c2c2c;
            --accent-color: #d4a373;
            --border-color: #e9e3d8;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        h1 {
            color: #333;
            margin-bottom: 5px;
        }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .product-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            transition: transform 0.2s;
        }
        .product-card:hover {
            transform: translateY(-3px);
        }
        .product-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background-color: #f0f0f0;
        }
        .product-info {
            padding: 15px;
        }
        .product-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .product-price {
            color: var(--accent-color);
            font-size: 1rem;
            font-weight: bold;
        }
        .loading {
            text-align: center;
            grid-column: 1 / -1;
            font-size: 1.2rem;
            color: #777;
            padding: 40px;
        }
    </style>
</head>
<body>

    <header>
        <h1>متجر داكن</h1>
        <p>تشكيلة مميزة من المنتجات المتنوعة</p>
    </header>

    <main>
        <div id="products-container" class="products-grid">
            <div class="loading">جاري تحميل المنتجات بسرعة الصاروخ...</div>
        </div>
    </main>

    <!-- ربط Firebase وتشغيل قاعدة البيانات -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // إعدادات مشروعك على فايرباس
        const firebaseConfig = {
            apiKey: "AIzaSyAeCLqtBvTvk430tgAIBRLu_r7nCFKu4ao",
            authDomain: "dakn-store.firebaseapp.com",
            projectId: "dakn-store",
            storageBucket: "dakn-store.firebasestorage.app",
            messagingSenderId: "89276988534",
            appId: "1:89276988534:web:9be7e75cb86ef815b63357",
            measurementId: "G-YNQGQ4J125"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function loadProducts() {
            const container = document.getElementById("products-container");
            try {
                const querySnapshot = await getDocs(collection(db, "products"));
                container.innerHTML = "";

                if (querySnapshot.empty) {
                    container.innerHTML = `<div class="loading">لا توجد منتجات مضافة حتى الآن. اذهب للوحة التحكم لإضافة منتجاتك!</div>`;
                    return;
                }

                querySnapshot.forEach((doc) => {
                    const p = doc.data();
                    const card = document.createElement("div");
                    card.className = "product-card";
                    card.innerHTML = `
                        <img src="${p.image || ''}" alt="${p.name || 'منتج'}" loading="lazy">
                        <div class="product-info">
                            <div class="product-title">${p.name || 'بدون اسم'}</div>
                            <div class="product-price">${p.price || 0} ج.م</div>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (error) {
                console.error("خطأ في التحميل:", error);
                container.innerHTML = `<div class="loading" style="color: red;">تعذر الاتصال بقاعدة البيانات. تأكد من الإنترنت وحاول مرة أخرى.</div>`;
            }
        }

        loadProducts();
    </script>
</body>
</html>
